<button type="button" onClick="{{ toggleSub }}" style="{{ subStyle }}">
<div style="width: 38px; height: 38px; border-radius: 10px; background: #fff; display: flex; align-items: center; justify-content: center; flex: none"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#0B7A5E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M17 2l4 4-4 4 M3 11V9a3 3 0 0 1 3-3h15 M7 22l-4-4 4-4 M21 13v2a3 3 0 0 1-3 3H3"></path></svg></div>
<div style="flex: 1; text-align: left"><div style="font-size: 14px; font-weight: 700; color: #10221D">Receber todo mês com 10% OFF</div><div style="font-size: 12px; color: #55645F">Avisamos 3 dias antes. Cancele quando quiser.</div></div>
<span style="{{ boxStyle }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M20 6 9 17l-5-5"></path></svg></span></button>

<a href="loja-busca.html" style="display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid #E3E9E6; border-radius: 16px; padding: 12px 14px; color: #10221D">
<div style="width: 44px; height: 44px; border-radius: 8px; background: #EAF1FD; display: flex; align-items: center; justify-content: center; flex: none"><svg width="34" height="34" viewBox="0 0 64 64" aria-hidden="true"><rect x="10" y="20" width="44" height="30" rx="3" fill="#fff" stroke="#1D5FD1" stroke-width="2"></rect><rect x="10" y="20" width="44" height="9" rx="2" fill="#1D5FD1" opacity="0.85"></rect><rect x="16" y="35" width="22" height="3" rx="1.5" fill="#1D5FD1" opacity="0.5"></rect><rect x="16" y="41" width="14" height="3" rx="1.5" fill="#1D5FD1" opacity="0.35"></rect></svg></div><div style="flex: 1"><div style="font-size: 12px; color: #55645F">Referência com o mesmo princípio ativo</div><div style="font-size: 14px; font-weight: 600">Cozaar 50mg · R$ 64,90</div></div><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#55645F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="m9 18 6-6-6-6"></path></svg></a>

<button type="button" onClick="{{ b.toggle }}" aria-expanded="{{ b.aria }}" style="width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; border: 0; background: transparent; min-height: 50px; font-size: 14px; font-weight: 600; color: #10221D; cursor: pointer; padding: 0; font-family: inherit"><span>{{ b.t }}</span><span style="{{ b.chev }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#55645F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="m9 18 6-6-6-6"></path></svg></span></button>
<sc-if value="{{ b.open }}" hint-placeholder-val="{{ false }}"><p style="margin: 0 0 14px; font-size: 13px; line-height: 1.55; color: #55645F">{{ b.d }}</p></sc-if></div></sc-for></section>
<p style="margin: 0 0 18px; font-size: 11px; line-height: 1.5; color: #55645F">Este medicamento exige prescrição médica. Apresente a receita na entrega ou retirada. SE PERSISTIREM OS SINTOMAS, O MÉDICO DEVERÁ SER CONSULTADO.</p>

</div>
<div style="display: flex; align-items: center; gap: 10px; padding: 12px 16px 18px; background: #fff; border-top: 1px solid #E3E9E6">
<div style="display: flex; align-items: center; border: 1px solid #E3E9E6; border-radius: 12px; min-height: 50px">

<span style="min-width: 24px; text-align: center; font-weight: 800; font-size: 16px">{{ qty }}</span>
<button type="button" aria-label="Aumentar" onClick="{{ inc }}" style="width: 44px; height: 48px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; color: #10221D; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#10221D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M12 5v14 M5 12h14"></path></svg></button></div>

<script type="text/x-dc" id="logic">
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { qty: 1, sub: false, open: { 0: true } }; }
  renderVals() {
    const B = [{"t": "Para que serve", "d": "Indicado para o tratamento da hipertensão arterial e para reduzir o risco de doença cardiovascular em pacientes hipertensos com hipertrofia ventricular esquerda."}, {"t": "Como usar", "d": "Use conforme orientação médica. A dose habitual é de 50 mg uma vez ao dia, com ou sem alimentos."}, {"t": "Contraindicações", "d": "Não use em caso de alergia aos componentes da fórmula nem durante a gravidez. Converse com seu médico antes de usar outros medicamentos."}, {"t": "Bula completa (PDF)", "d": "Bula do paciente e do profissional, conforme a Anvisa."}];
    const { qty, sub, open } = this.state;
    const unit = 11.90 * (sub ? 0.9 : 1);
    const total = 'R$ ' + (unit * qty).toFixed(2).replace('.', ',');
    const bula = B.map((b, i) => Object.assign({}, b, { open: !!open[i], aria: open[i] ? 'true' : 'false',
      chev: 'display: flex; transition: transform 0.15s; transform: rotate(' + (open[i] ? '90deg' : '0deg') + ')',
      toggle: () => this.setState({ open: Object.assign({}, this.state.open, { [i]: !this.state.open[i] }) }) }));
    return { qty, total, bula,
      inc: () => this.setState({ qty: Math.min(9, qty + 1) }), dec: () => this.setState({ qty: Math.max(1, qty - 1) }),
      toggleSub: () => this.setState({ sub: !sub }),
      subStyle: 'display: flex; align-items: center; gap: 10px; width: 100%; border-radius: 16px; padding: 12px 14px; cursor: pointer; font-family: inherit; ' + (sub ? 'background: #E6F4EF; border: 1.5px solid #0B7A5E' : 'background: #fff; border: 1.5px solid #E3E9E6'),
      boxStyle: 'width: 24px; height: 24px; border-radius: 7px; display: flex; align-items: center; justify-content: center; flex: none; ' + (sub ? 'background: #0B7A5E' : 'background: #fff; border: 1.5px solid #C9D3CF') };
  }
}
</script>
