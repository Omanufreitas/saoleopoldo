<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B7A5E">
<title>Loja — checkout · Drogaria Modelo</title>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;color:#10221D;-webkit-font-smoothing:antialiased}
a{color:#0B7A5E;text-decoration:none}a:hover{color:#075E48}
button{font-family:inherit}
input,select{font-family:inherit}
.nav-a{color:#C9DDD6}.nav-a:hover{color:#fff;background:rgba(255,255,255,0.06)}
.row-h:hover{background:#F8FAF9}
.btn-p:hover{background:#075E48 !important;color:#fff !important}
.btn-g:hover{background:#EEF2F0 !important}

</style>

<style>
body{background:#DCE5E1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 0;box-sizing:border-box}
#app>div{border-radius:36px;box-shadow:0 30px 60px rgba(12,43,36,0.22),0 0 0 10px #10221D}
.demo-back{position:fixed;top:16px;left:16px;display:inline-flex;align-items:center;gap:8px;background:#fff;color:#10221D;font:600 13px Inter,sans-serif;padding:10px 14px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,0.1)}
@media (max-width:520px){body{padding:0;display:block;background:#F5F7F6}#app>div{width:100vw !important;height:100vh !important;height:100dvh !important;border-radius:0;box-shadow:none}.demo-back{display:none}}
</style>
</head>
<body>
<a class="demo-back" href="painel.html">← Ver painel da farmácia</a>
<div id="app"></div>
<template id="tpl">
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F7F6; display: flex; flex-direction: column; overflow: hidden; font-family: Inter, system-ui, sans-serif">
<div style="flex: 1; min-height: 0; overflow-y: auto">
<header style="display: flex; align-items: center; gap: 8px; padding: 14px 12px 10px; background: #fff; border-bottom: 1px solid #E3E9E6">
<a href="loja-carrinho.html" aria-label="Voltar" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #10221D; border-radius: 12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="m15 18-6-6 6-6"></path></svg></a>
<h1 style="margin: 0; flex: 1; font-size: 17px; font-weight: 700">Finalizar pedido</h1></header>
<div style="padding: 14px 16px; display: flex; flex-direction: column; gap: 14px">
<section style="background: #fff; border-radius: 16px; padding: 14px; border: 1px solid #E3E9E6; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 8px"><span style="width: 22px; height: 22px; border-radius: 50%; background: #0B7A5E; color: #fff; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">1</span><h2 style="margin: 0; font-size: 15px; font-weight: 800">Como você quer receber?</h2></div>
<div role="group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px">
<sc-for list="{{ modes }}" as="o" hint-placeholder-count="2"><button type="button" onClick="{{ o.pick }}" style="{{ o.style }}"><span style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700">{{ o.l }}</span><span style="font-size: 12px; font-weight: 500; color: #55645F">{{ o.s }}</span></button></sc-for></div>
<sc-if value="{{ isDel }}" hint-placeholder-val="{{ true }}"><div style="display: flex; gap: 10px; align-items: center; background: #F5F7F6; border-radius: 12px; padding: 10px 12px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B7A5E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12Z M12 12.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z"></path></svg><div style="flex: 1; font-size: 13px"><strong>Rua Joaquim Murtinho, 1220 · ap 32</strong><div style="color: #55645F">Tiradentes · chega em até 40 min</div></div><span style="font-size: 13px; font-weight: 600; color: #0B7A5E">Trocar</span></div></sc-if>
<sc-if value="{{ isPick }}" hint-placeholder-val="{{ false }}"><div style="display: flex; gap: 10px; align-items: center; background: #F5F7F6; border-radius: 12px; padding: 10px 12px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B7A5E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M3 9l1.5-5h15L21 9 M3 9v11h18V9 M3 9h18 M9 20v-6h6v6"></path></svg><div style="flex: 1; font-size: 13px"><strong>Unidade Tiradentes · 1,2 km</strong><div style="color: #55645F">Av. Tiradentes, 2150 · pronto em 15 min · balcão sem fila</div></div><span style="font-size: 13px; font-weight: 600; color: #0B7A5E">Trocar</span></div></sc-if>
</section>

<section style="background: #fff; border-radius: 16px; padding: 14px; border: 1px solid #E3E9E6; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 8px"><span style="width: 22px; height: 22px; border-radius: 50%; background: #0B7A5E; color: #fff; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">2</span><h2 style="margin: 0; font-size: 15px; font-weight: 800">Pagamento</h2></div>
<div role="group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px">
<sc-for list="{{ pays }}" as="o" hint-placeholder-count="2"><button type="button" onClick="{{ o.pick }}" style="{{ o.style }}"><span style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700">{{ o.l }}</span><span style="font-size: 12px; font-weight: 500; color: #55645F">{{ o.s }}</span></button></sc-for></div>
<sc-if value="{{ isCard }}" hint-placeholder-val="{{ false }}"><div style="display: flex; gap: 10px; align-items: center; background: #F5F7F6; border-radius: 12px; padding: 10px 12px; font-size: 13px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#10221D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M2 6h20v12H2z M2 10h20"></path></svg><span style="flex: 1"><strong>Mastercard final 4417</strong> · 1x sem juros</span><span style="font-weight: 600; color: #0B7A5E">Trocar</span></div></sc-if>
<sc-if value="{{ isPix }}" hint-placeholder-val="{{ true }}"><div style="font-size: 12px; color: #55645F; display: flex; gap: 6px; align-items: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#55645F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Z M12 7v5l3 2"></path></svg>Código Pix válido por 30 min · confirmação na hora</div></sc-if>
</section>

<section style="background: #fff; border-radius: 16px; padding: 14px; border: 1px solid #E3E9E6; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 8px"><span style="width: 22px; height: 22px; border-radius: 50%; background: #0B7A5E; color: #fff; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">3</span><h2 style="margin: 0; font-size: 15px; font-weight: 800">Receita</h2></div>
<div style="font-size: 13px; color: #55645F">Losartana 50mg exige receita. Escolha como apresentar:</div>
<div style="display: flex; gap: 8px"><button type="button" onClick="{{ rxPhoto }}" style="{{ rx1 }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M14 3H6v18h12V7l-4-4Z M14 3v4h4 M9 13h6 M9 17h6"></path></svg>Enviar foto</button><button type="button" onClick="{{ rxShow }}" style="{{ rx2 }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2 M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"></path></svg>{{ rxShowLabel }}</button></div>
<sc-if value="{{ rxSent }}" hint-placeholder-val="{{ false }}"><div style="font-size: 13px; color: #0B7A5E; font-weight: 600; display: flex; gap: 6px; align-items: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#0B7A5E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M20 6 9 17l-5-5"></path></svg>receita_losartana.jpg · o farmacêutico confere antes de separar</div></sc-if>
</section>

<button type="button" onClick="{{ togglePts }}" style="{{ ptsStyle }}">
<span style="display: flex; align-items: center; gap: 10px; flex: 1; text-align: left"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9A6A00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1L12 2Z"></path></svg><span><span style="display: block; font-size: 14px; font-weight: 700; color: #10221D">Usar 200 pontos</span><span style="display: block; font-size: 12px; color: #55645F">desconto de R$ 10,00 · saldo 2.340</span></span></span>
<span style="{{ ptsBox }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M20 6 9 17l-5-5"></path></svg></span></button>

<section style="background: #fff; border-radius: 16px; padding: 14px; border: 1px solid #E3E9E6; display: flex; flex-direction: column; gap: 8px; font-size: 14px">
<div style="display: flex; justify-content: space-between"><span style="color: #55645F">Produtos (4)</span><span>R$ 93,60</span></div>
<div style="display: flex; justify-content: space-between"><span style="color: #55645F">{{ feeLabel }}</span><span>{{ fee }}</span></div>
<sc-if value="{{ usePts }}" hint-placeholder-val="{{ false }}"><div style="display: flex; justify-content: space-between"><span style="color: #55645F">Pontos</span><span style="color: #0B7A5E; font-weight: 600">- R$ 10,00</span></div></sc-if>
<div style="display: flex; justify-content: space-between; border-top: 1px solid #E3E9E6; padding-top: 10px; font-size: 16px"><strong>Total</strong><strong>{{ total }}</strong></div></section>
</div>
</div>
<div style="padding: 12px 16px 18px; background: #fff; border-top: 1px solid #E3E9E6">
<a href="loja-pedido.html" class="btn-p" style="display: flex; align-items: center; justify-content: center; gap: 8px; background: #0B7A5E; color: #fff; border-radius: 14px; min-height: 52px; font-size: 15px; font-weight: 700">{{ cta }}</a>
<div style="display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 11px; color: #55645F; margin-top: 8px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#55645F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"></path></svg>Pagamento seguro · seus dados não ficam com a farmácia</div></div>
</div>
</template>
<script type="text/x-dc" id="logic">
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { mode: 'del', pay: 'pix', pts: false, rx: 'none' }; }
  renderVals() {
    const { mode, pay, pts, rx } = this.state;
    const f = (v) => 'R$ ' + v.toFixed(2).replace('.', ',');
    const box = 'display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 12px; border-radius: 12px; cursor: pointer; font-family: inherit; color: #10221D; min-height: 64px; text-align: left; ';
    const on = (b) => box + (b ? 'background: #F1F8F5; border: 2px solid #0B7A5E' : 'background: #fff; border: 2px solid #E3E9E6');
    const modes = [{ id: 'del', l: 'Entrega', s: 'até 40 min · R$ 4,90' }, { id: 'pick', l: 'Retirar na loja', s: 'em 15 min · grátis' }]
      .map(o => Object.assign({}, o, { style: on(o.id === mode), pick: () => this.setState({ mode: o.id }) }));
    const pays = [{ id: 'pix', l: 'Pix', s: 'aprovação na hora' }, { id: 'card', l: 'Cartão de crédito', s: 'até 3x sem juros' }]
      .map(o => Object.assign({}, o, { style: on(o.id === pay), pick: () => this.setState({ pay: o.id }) }));
    const fee = mode === 'del' ? 4.90 : 0;
    const total = 93.60 + fee - (pts ? 10 : 0);
    const rxb = 'flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: 10px; min-height: 42px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; ';
    const rxs = (b) => rxb + (b ? 'background: #0B7A5E; color: #fff; border: 0' : 'background: #fff; color: #10221D; border: 1px solid #E3E9E6');
    return { modes, pays, isDel: mode === 'del', isPick: mode === 'pick', isPix: pay === 'pix', isCard: pay === 'card',
      feeLabel: mode === 'del' ? 'Entrega' : 'Retirada', fee: fee ? f(fee) : 'Grátis', total: f(total), usePts: pts,
      togglePts: () => this.setState({ pts: !pts }),
      ptsStyle: 'display: flex; align-items: center; gap: 10px; width: 100%; border-radius: 16px; padding: 12px 14px; cursor: pointer; font-family: inherit; ' + (pts ? 'background: #FDF6E3; border: 1.5px solid #9A6A00' : 'background: #fff; border: 1.5px solid #E3E9E6'),
      ptsBox: 'width: 24px; height: 24px; border-radius: 7px; display: flex; align-items: center; justify-content: center; flex: none; ' + (pts ? 'background: #9A6A00' : 'background: #fff; border: 1.5px solid #C9D3CF'),
      rxPhoto: () => this.setState({ rx: 'photo' }), rxShow: () => this.setState({ rx: 'show' }),
      rx1: rxs(rx === 'photo'), rx2: rxs(rx === 'show'), rxSent: rx === 'photo',
      rxShowLabel: mode === 'del' ? 'Mostrar na entrega' : 'Mostrar no balcão',
      cta: (pay === 'pix' ? 'Pagar com Pix · ' : 'Pagar com cartão · ') + f(total) };
  }
}
</script>
<script src="dc-runtime.js"></script>
<script>bootDC();</script>
</body>
</html>
