    const COLS = [{"id": "novo", "label": "Novos", "fg": "#1D5FD1", "bg": "#EAF1FD"}, {"id": "separacao", "label": "Em separação", "fg": "#9A6A00", "bg": "#FDF6E3"}, {"id": "saiu", "label": "Saiu para entrega", "fg": "#6D3FC0", "bg": "#F3EEFB"}, {"id": "pronto", "label": "Pronto para retirada", "fg": "#0B7A5E", "bg": "#E6F4EF"}, {"id": "entregue", "label": "Entregue", "fg": "#3D4B47", "bg": "#EEF2F0"}, {"id": "cancelado", "label": "Cancelado", "fg": "#B42318", "bg": "#FDECEA"}];
    const NEXT = { novo: 'separacao', separacao: null, saiu: 'entregue', pronto: 'entregue' };
    const LABEL = { novo: 'Iniciar separação', separacao: null, saiu: 'Confirmar entrega', pronto: 'Retirado' };
    const { unit, mode } = this.state;
    const list = this.state.orders.filter(o => (unit === 'all' || o.unit === unit) && (mode === 'all' || o.mode === mode));
    const move = (id) => {
      this.setState({ orders: this.state.orders.map(o => {
        if (o.id !== id) return o;
        let st = NEXT[o.st];
        if (o.st === 'separacao') st = o.mode === 'entrega' ? 'saiu' : 'pronto';
        return Object.assign({}, o, { st, ago: 'agora' });
      }) });
    };
    const pill = 'font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 999px; ';
    const cols = COLS.map(c => {
      const orders = list.filter(o => o.st === c.id).map(o => {
        const late = o.st === 'separacao' && (o.ago === '22 min' || o.ago === '24 min');
        return Object.assign({}, o, {
          payLabel: o.pay === 'pix' ? 'Pix' : 'Cartão',
          modeLabel: o.mode === 'entrega' ? 'Entrega' : 'Retirada',
          modeStyle: pill + (o.mode === 'entrega' ? 'background: #EAF1FD; color: #1D5FD1' : 'background: #E6F4EF; color: #075E48'),
          agoStyle: 'display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: ' + (late ? '#B42318' : '#55645F'),
          canAdvance: o.st in LABEL && o.st !== 'entregue',
          next: o.st === 'separacao' ? (o.mode === 'entrega' ? 'Despachar' : 'Pronto p/ retirar') : LABEL[o.st],
          advance: () => move(o.id)
        });
      });
      return Object.assign({}, c, { orders, count: orders.length, empty: orders.length === 0,
        labelStyle: 'font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 999px; color: ' + c.fg + '; background: ' + c.bg });
    });
    const base = 'border: 0; border-radius: 8px; padding: 0 14px; min-height: 36px; font-size: 13px; font-weight: 600; cursor: pointer; ';
    const modes = [['all','Todos'],['entrega','Entrega'],['retirada','Retirada']].map(([id, label]) => ({ label,
      pick: () => this.setState({ mode: id }),
      style: base + (id === mode ? 'background: #0B7A5E; color: #fff' : 'background: transparent; color: #55645F') }));
    return { cols, modes, unit, setUnit: (e) => this.setState({ unit: e.target.value }) };
  }
