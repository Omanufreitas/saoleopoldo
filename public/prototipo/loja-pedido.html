<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#276A2C">
<title>Loja — acompanhar pedido · Drogaria São Leopoldo</title>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;color:#12201A;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
a{color:#276A2C;text-decoration:none}a:hover{color:#1B4F1F}
button{font-family:inherit}input,select{font-family:inherit}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid #3E9B44;outline-offset:2px}
a,button{transition:background-color .2s ease,color .2s ease,border-color .2s ease,box-shadow .25s ease,transform .18s ease}
button:active,a:active{transform:scale(.97)}
@keyframes fxUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fxIn{from{opacity:0}to{opacity:1}}
@keyframes fxGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fxDraw{to{stroke-dashoffset:0}}
@keyframes fxPulse{0%{box-shadow:0 0 0 0 rgba(62,155,68,.55)}70%{box-shadow:0 0 0 12px rgba(62,155,68,0)}100%{box-shadow:0 0 0 0 rgba(62,155,68,0)}}
@keyframes fxShine{from{transform:translateX(-120%) skewX(-18deg)}to{transform:translateX(320%) skewX(-18deg)}}
@keyframes fxFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
main>*{animation:fxUp .7s cubic-bezier(.2,.7,.2,1) both}
main>*:nth-child(2){animation-delay:.06s}main>*:nth-child(3){animation-delay:.12s}main>*:nth-child(4){animation-delay:.18s}main>*:nth-child(5){animation-delay:.24s}main>*:nth-child(6){animation-delay:.3s}main>*:nth-child(7){animation-delay:.36s}
main section{box-shadow:0 1px 2px rgba(16,34,29,.04),0 10px 30px -18px rgba(16,34,29,.22);transition:box-shadow .3s ease,transform .3s ease,border-color .3s ease}
main section:hover{box-shadow:0 2px 4px rgba(16,34,29,.05),0 22px 44px -20px rgba(16,34,29,.30);border-color:#D9D7CC !important}
.lift:hover{transform:translateY(-3px)}
article{transition:transform .25s ease,box-shadow .25s ease}article:hover{transform:translateY(-3px);box-shadow:0 18px 32px -18px rgba(16,34,29,.35)}
.fx-grow{transform-origin:left center;animation:fxGrow 1.1s cubic-bezier(.2,.7,.2,1) .25s both}
.fx-draw{stroke-dasharray:1;stroke-dashoffset:1;animation:fxDraw 1.6s cubic-bezier(.4,.1,.2,1) .3s forwards}
.fx-fade{animation:fxIn 1.2s ease .5s both}
.fx-live{animation:fxPulse 2s infinite}
.fx-float{animation:fxFloat 4s ease-in-out infinite}
.fx-shine{position:relative;overflow:hidden}.fx-shine::after{content:"";position:absolute;top:0;bottom:0;left:0;width:30%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);animation:fxShine 3.6s ease-in-out 1s infinite}
path.morph{transition:d .7s cubic-bezier(.2,.7,.2,1)}
.nav-a{color:#BED5C0}.nav-a:hover{color:#fff;background:rgba(255,255,255,0.07)}
.row-h{transition:background-color .15s}.row-h:hover{background:#F5F8F1}
.btn-p{background:linear-gradient(180deg,#31803A,#276A2C) !important;box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 8px 18px -8px rgba(39,106,44,.7)}
.btn-p:hover{box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 12px 24px -8px rgba(39,106,44,.85);color:#fff !important;transform:translateY(-1px)}
.btn-g:hover{background:#F1F5F3 !important;border-color:#D6D4C9 !important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}.fx-draw{stroke-dashoffset:0}}
.scr>*{animation:fxUp .6s cubic-bezier(.2,.7,.2,1) both}.scr>*:nth-child(2){animation-delay:.05s}.scr>*:nth-child(3){animation-delay:.1s}.scr>*:nth-child(4){animation-delay:.15s}.scr>*:nth-child(5){animation-delay:.2s}.scr>*:nth-child(6){animation-delay:.25s}.scr>*:nth-child(7){animation-delay:.3s}
.scr section{box-shadow:0 1px 2px rgba(18,32,26,.04),0 10px 24px -16px rgba(18,32,26,.25)}
.pc{box-shadow:0 1px 2px rgba(18,32,26,.04),0 10px 22px -16px rgba(18,32,26,.3)}.pc:hover{transform:translateY(-3px);box-shadow:0 16px 28px -16px rgba(18,32,26,.4)}
.tab-on{background:#E7F2E2;border-radius:999px;padding:4px 16px}
nav.tb{background:rgba(255,255,255,.88);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px)}

</style>

<style>

.demo-back{position:fixed;top:16px;left:16px;display:inline-flex;align-items:center;gap:8px;background:#fff;color:#12201A;font:600 13px Inter,sans-serif;padding:10px 14px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,0.1)}
@media (max-width:520px){body{padding:0;display:block;background:#F7F6F1}#app>div{width:100vw !important;height:100vh !important;height:100dvh !important;border-radius:0;box-shadow:none}.demo-back{display:none}}
</style>
</head>
<body>
<a class="demo-back" href="painel.html">← Ver painel da farmácia</a>
<div id="app"></div>
<template id="tpl">

<div class="scr" style="flex: 1; min-height: 0; overflow-y: auto">
<div style="position: relative; height: 210px; background: #E8EEEB; overflow: hidden">
<svg width="390" height="210" viewBox="0 0 390 210" aria-hidden="true" style="position: absolute; inset: 0">
<rect x="0" y="0" width="390" height="210" fill="#E8EEEB"></rect>
<path d="M0 60 H390 M0 140 H390 M90 0 V210 M210 0 V210 M310 0 V210" stroke="#fff" stroke-width="14"></path>
<path d="M0 100 H390 M150 0 V210 M260 0 V210" stroke="#F7FAF8" stroke-width="7"></path>
<rect x="100" y="70" width="40" height="22" rx="3" fill="#D5E3DC"></rect><rect x="220" y="150" width="78" height="40" rx="4" fill="#CFE7DC"></rect><rect x="320" y="10" width="56" height="40" rx="4" fill="#D5E3DC"></rect>

<div style="position: absolute; left: 76px; top: 150px; width: 30px; height: 30px; border-radius: 50%; background: #0F2413; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(0,0,0,0.2)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M3 9l1.5-5h15L21 9 M3 9v11h18V9 M3 9h18 M9 20v-6h6v6"></path></svg></div>

<div style="position: absolute; left: 296px; top: 22px; width: 30px; height: 30px; border-radius: 50%; background: #C22A26; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(0,0,0,0.2)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"></path></svg></div>
<a href="loja.html" aria-label="Voltar ao início" style="position: absolute; left: 12px; top: 12px; width: 44px; height: 44px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; color: #12201A; box-shadow: 0 2px 6px rgba(0,0,0,0.12)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="m15 18-6-6 6-6"></path></svg></a>
</div><div style="background: #fff; border-radius: 22px 22px 0 0; margin-top: -18px; position: relative; padding: 18px 16px 8px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between; align-items: flex-start">

<div style="display: flex; gap: 4px"><sc-for list="{{ bars }}" as="b" hint-placeholder-count="4"><span style="{{ b.style }}"></span></sc-for></div>
<sc-if value="{{ showRider }}" hint-placeholder-val="{{ false }}">

<div style="width: 40px; height: 40px; border-radius: 50%; background: #0F2413; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px">AM</div>
<div style="flex: 1"><div style="font-size: 14px; font-weight: 700">Anderson · entregador</div><div style="font-size: 12px; color: #56645A">Moto · placa final 4K21</div></div>
<button type="button" aria-label="Conversar com o entregador" style="width: 44px; height: 44px; border-radius: 12px; border: 0; background: #276A2C; color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M21 11.5a8.4 8.4 0 0 1-12.6 7.3L3 20l1.3-5.1A8.4 8.4 0 1 1 21 11.5Z"></path></svg></button></div></sc-if>
<div><sc-for list="{{ steps }}" as="s" hint-placeholder-count="4"><div style="display: flex; gap: 12px">
<div style="display: flex; flex-direction: column; align-items: center"><span style="{{ s.dot }}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M20 6 9 17l-5-5"></path></svg></span><sc-if value="{{ s.notLast }}" hint-placeholder-val="{{ true }}"><span style="{{ s.line }}"></span></sc-if></div>
<div style="padding-bottom: 14px; flex: 1"><div style="{{ s.tStyle }}">{{ s.t }}</div><div style="font-size: 12px; color: #56645A">{{ s.d }}</div></div>
<span style="font-size: 12px; color: #56645A">{{ s.h }}</span></div></sc-for></div>
<div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #E7E6DE; padding-top: 12px; font-size: 13px">
<span style="color: #56645A">4 itens · Pix · <strong style="color: #12201A">R$ 98,50</strong></span>
<button type="button" onClick="{{ restart }}" style="border: 0; background: transparent; color: #276A2C; font-weight: 600; font-size: 13px; cursor: pointer; min-height: 40px">Rever animação</button></div>

<div style="background: #FDF6E3; border-radius: 14px; padding: 12px 14px; display: flex; gap: 10px; align-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9A6A00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1L12 2Z"></path></svg><div style="flex: 1; font-size: 13px">Você ganhou <strong>186 pontos</strong>. Avalie sua entrega e ganhe +20.</div><a href="loja-pontos.html" style="font-size: 13px; font-weight: 700">Ver</a></div></sc-if>
<a href="pedidos.html" style="font-size: 12px; color: #56645A; text-align: center; padding: 4px 0 10px">Demo: ver este pedido no painel da farmácia →</a>
</div>
</div>
<nav class="tb" aria-label="Navegação da loja" style="display: flex; border-top: 1px solid #E7E6DE; background: #fff; padding: 4px 6px 14px"><a href="loja.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 56px; color: #6B7A75; font-size: 11px; font-weight: 500"><span class="" style="position: relative; display: flex"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B7A75" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"></path></svg></span>Início</a><a href="loja-busca.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 56px; color: #6B7A75; font-size: 11px; font-weight: 500"><span class="" style="position: relative; display: flex"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B7A75" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16Z M21 21l-4.35-4.35"></path></svg></span>Buscar</a><a href="loja-carrinho.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 56px; color: #6B7A75; font-size: 11px; font-weight: 500"><span class="" style="position: relative; display: flex"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B7A75" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M3 3h2l2.4 12.2a1 1 0 0 0 1 .8h9.7a1 1 0 0 0 1-.76L21 8H6 M9 21a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z M18 21a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z"></path></svg><span style="position: absolute; top: -4px; right: -9px; background: #C22A26; color: #fff; font-size: 10px; font-weight: 700; min-width: 16px; height: 16px; border-radius: 8px; display: flex; align-items: center; justify-content: center">3</span></span>Carrinho</a><a href="loja-pedido.html" aria-current="page" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 56px; color: #276A2C; font-size: 11px; font-weight: 700"><span class="tab-on" style="position: relative; display: flex"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#276A2C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M6 7h12l1 14H5L6 7Z M9 7a3 3 0 0 1 6 0"></path></svg></span>Pedidos</a><a href="loja-pontos.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 56px; color: #6B7A75; font-size: 11px; font-weight: 500"><span class="" style="position: relative; display: flex"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B7A75" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1L12 2Z"></path></svg></span>Pontos</a></nav>
</div>
</template>
<script type="text/x-dc" id="logic">
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { step: 0 }; }
  componentDidMount() { this.tick(); }
  componentWillUnmount() { clearInterval(this.t); }
  tick() { clearInterval(this.t); this.t = setInterval(() => { if (this.state.step >= 3) clearInterval(this.t); else this.setState({ step: this.state.step + 1 }); }, 3500); }
  renderVals() {
    const s = this.state.step;
    const S = [
      { t: 'Pedido confirmado', d: 'Pix aprovado na hora', h: '10:31' },
      { t: 'Em separação', d: 'Farmacêutico conferiu a receita', h: '10:34' },
      { t: 'Saiu para entrega', d: 'Anderson está a caminho', h: '10:42' },
      { t: 'Entregue', d: 'Receita conferida na porta', h: '11:05' }
    ];
    const steps = S.map((x, i) => Object.assign({}, x, { notLast: i < 3, h: i <= s ? x.h : '',
      dot: 'width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex: none; ' + (i <= s ? 'background: #276A2C' : 'background: #fff; border: 2px solid #CDCBC0'),
      line: 'width: 2px; flex: 1; min-height: 22px; background: ' + (i < s ? '#276A2C' : '#E7E6DE'),
      tStyle: 'font-size: 14px; font-weight: ' + (i === s ? '800' : '600') + '; color: ' + (i <= s ? '#12201A' : '#8A9893') }));
    const bars = [0, 1, 2, 3].map(i => ({ style: 'flex: 1; height: 6px; border-radius: 3px; background: ' + (i <= s ? '#276A2C' : '#E7E6DE') }));
    const pos = [[76, 150], [76, 150], [196, 86], [296, 22]][s];
    return { steps, bars, headline: ['Pedido confirmado', 'Separando seu pedido', 'A caminho', 'Pedido entregue!'][s],
      eta: ['11:10', '11:08', '11:05', 'Entregue'][s], showRider: s === 2, done: s === 3,
      bikeStyle: 'position: absolute; width: 34px; height: 34px; border-radius: 50%; background: #276A2C; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 6px rgba(39,106,44,0.2); transition: left 1.2s, top 1.2s; left: ' + pos[0] + 'px; top: ' + pos[1] + 'px; opacity: ' + (s >= 2 ? 1 : 0),
      restart: () => { this.setState({ step: 0 }); this.tick(); } };
  }
}
</script>
<script src="dc-runtime.js"></script>
<script>bootDC();</script>
