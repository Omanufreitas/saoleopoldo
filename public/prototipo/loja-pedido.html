<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B7A5E">
<title>Loja — acompanhar pedido · Drogaria Modelo</title>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;color:#10221D;-webkit-font-smoothing:antialiased}
a{color:#0B7A5E;text-decoration:none}a:hover{color:#075E48}
button{font-family:inherit}
input,select{font-family:inherit}
.nav-a{color:#C9DDD6}.nav-a:hover{color:#fff;background:rgba(255,255,255,0.06)}
.row-h:hover{background:#F8FAF9}
.btn-p:hover{background:#075E48 !important;color:#fff !important}
.btn-g:hover{background:#EEF2F0 !important}

</style>

<style>
body{background:#DCE5E1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 0;box-sizing:border-box}
#app>div{border-radius:36px;box-shadow:0 30px 60px rgba(12,43,36,0.22),0 0 0 10px #10221D}
.demo-back{position:fixed;top:16px;left:16px;display:inline-flex;align-items:center;gap:8px;background:#fff;color:#10221D;font:600 13px Inter,sans-serif;padding:10px 14px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,0.1)}
@media (max-width:520px){body{padding:0;display:block;background:#F5F7F6}#app>div{width:100vw !important;height:100vh !important;height:100dvh !important;border-radius:0;box-shadow:none}.demo-back{display:none}}
</style>
</head>
<body>
<a class="demo-back" href="painel.html">← Ver painel da farmácia</a>
<div id="app"></div>
<template id="tpl">
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F7F6; display: flex; flex-direction: column; overflow: hidden; font-family: Inter, system-ui, sans-serif">
<div style="flex: 1; min-height: 0; overflow-y: auto">
<div style="position: relative; height: 210px; background: #E8EEEB; overflow: hidden">
<svg width="390" height="210" viewBox="0 0 390 210" aria-hidden="true" style="position: absolute; inset: 0">
<rect x="0" y="0" width="390" height="210" fill="#E8EEEB"></rect>
<path d="M0 60 H390 M0 140 H390 M90 0 V210 M210 0 V210 M310 0 V210" stroke="#fff" stroke-width="14"></path>
<path d="M0 100 H390 M150 0 V210 M260 0 V210" stroke="#F7FAF8" stroke-width="7"></path>
<rect x="100" y="70" width="40" height="22" rx="3" fill="#D5E3DC"></rect><rect x="220" y="150" width="78" height="40" rx="4" fill="#CFE7DC"></rect><rect x="320" y="10" width="56" height="40" rx="4" fill="#D5E3DC"></rect>
<path d="M90 160 V140 H210 V60 H310 V40" fill="none" stroke="#0B7A5E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 9"></path>
</svg>
<div style="position: absolute; left: 76px; top: 150px; width: 30px; height: 30px; border-radius: 50%; background: #0C2B24; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(0,0,0,0.2)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M3 9l1.5-5h15L21 9 M3 9v11h18V9 M3 9h18 M9 20v-6h6v6"></path></svg></div>
<div style="{{ bikeStyle }}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M1 4h14v12H1z M15 9h4l3 3v4h-7 M5.5 19a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z M18.5 19a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z"></path></svg></div>
<div style="position: absolute; left: 296px; top: 22px; width: 30px; height: 30px; border-radius: 50%; background: #C2410C; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(0,0,0,0.2)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"></path></svg></div>
<a href="loja.html" aria-label="Voltar ao início" style="position: absolute; left: 12px; top: 12px; width: 44px; height: 44px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; color: #10221D; box-shadow: 0 2px 6px rgba(0,0,0,0.12)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="m15 18-6-6 6-6"></path></svg></a>
</div><div style="background: #fff; border-radius: 22px 22px 0 0; margin-top: -18px; position: relative; padding: 18px 16px 8px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between; align-items: flex-start">
<div><div style="font-size: 12px; color: #55645F">Pedido #48231 · Tiradentes</div><h1 style="margin: 2px 0 0; font-family: 'Plus Jakarta Sans', Inter, sans-serif; font-size: 22px; font-weight: 800">{{ headline }}</h1></div>
<div style="text-align: right"><div style="font-size: 12px; color: #55645F">Previsão</div><div style="font-family: 'Plus Jakarta Sans', Inter, sans-serif; font-size: 20px; font-weight: 800; color: #0B7A5E">{{ eta }}</div></div></div>
<div style="display: flex; gap: 4px"><sc-for list="{{ bars }}" as="b" hint-placeholder-count="4"><span style="{{ b.style }}"></span></sc-for></div>
<sc-if value="{{ showRider }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; gap: 12px; background: #F5F7F6; border-radius: 14px; padding: 10px 12px">
<div style="width: 40px; height: 40px; border-radius: 50%; background: #0C2B24; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px">AM</div>
<div style="flex: 1"><div style="font-size: 14px; font-weight: 700">Anderson · entregador</div><div style="font-size: 12px; color: #55645F">Moto · placa final 4K21</div></div>
<button type="button" aria-label="Conversar com o entregador" style="width: 44px; height: 44px; border-radius: 12px; border: 0; background: #0B7A5E; color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M21 11.5a8.4 8.4 0 0 1-12.6 7.3L3 20l1.3-5.1A8.4 8.4 0 1 1 21 11.5Z"></path></svg></button></div></sc-if>
<div><sc-for list="{{ steps }}" as="s" hint-placeholder-count="4"><div style="display: flex; gap: 12px">
<div style="display: flex; flex-direction: column; align-items: center"><span style="{{ s.dot }}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M20 6 9 17l-5-5"></path></svg></span><sc-if value="{{ s.notLast }}" hint-placeholder-val="{{ true }}"><span style="{{ s.line }}"></span></sc-if></div>
<div style="padding-bottom: 14px; flex: 1"><div style="{{ s.tStyle }}">{{ s.t }}</div><div style="font-size: 12px; color: #55645F">{{ s.d }}</div></div>
<span style="font-size: 12px; color: #55645F">{{ s.h }}</span></div></sc-for></div>
<div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #E3E9E6; padding-top: 12px; font-size: 13px">
<span style="color: #55645F">4 itens · Pix · <strong style="color: #10221D">R$ 98,50</strong></span>
<button type="button" onClick="{{ restart }}" style="border: 0; background: transparent; color: #0B7A5E; font-weight: 600; font-size: 13px; cursor: pointer; min-height: 40px">Rever animação</button></div>
<sc-if value="{{ done }}" hint-placeholder-val="{{ false }}">
<div style="background: #FDF6E3; border-radius: 14px; padding: 12px 14px; display: flex; gap: 10px; align-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9A6A00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1L12 2Z"></path></svg><div style="flex: 1; font-size: 13px">Você ganhou <strong>186 pontos</strong>. Avalie sua entrega e ganhe +20.</div><a href="loja-pontos.html" style="font-size: 13px; font-weight: 700">Ver</a></div></sc-if>
<a href="pedidos.html" style="font-size: 12px; color: #55645F; text-align: center; padding: 4px 0 10px">Demo: ver este pedido no painel da farmácia →</a>
</div>
</div>
<nav aria-label="Navegação da loja" style="display: flex; border-top: 1px solid #E3E9E6; background: #fff; padding: 4px 6px 14px"><a href="loja.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 56px; color: #6B7A75; font-size: 11px; font-weight: 500"><span style="position: relative; display: flex"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B7A75" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"></path></svg></span>Início</a><a href="loja-busca.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 56px; color: #6B7A75; font-size: 11px; font-weight: 500"><span style="position: relative; display: flex"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B7A75" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16Z M21 21l-4.35-4.35"></path></svg></span>Buscar</a><a href="loja-carrinho.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 56px; color: #6B7A75; font-size: 11px; font-weight: 500"><span style="position: relative; display: flex"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B7A75" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M3 3h2l2.4 12.2a1 1 0 0 0 1 .8h9.7a1 1 0 0 0 1-.76L21 8H6 M9 21a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z M18 21a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z"></path></svg><span style="position: absolute; top: -4px; right: -9px; background: #C2410C; color: #fff; font-size: 10px; font-weight: 700; min-width: 16px; height: 16px; border-radius: 8px; display: flex; align-items: center; justify-content: center">3</span></span>Carrinho</a><a href="loja-pedido.html" aria-current="page" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 56px; color: #0B7A5E; font-size: 11px; font-weight: 700"><span style="position: relative; display: flex"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0B7A5E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M6 7h12l1 14H5L6 7Z M9 7a3 3 0 0 1 6 0"></path></svg></span>Pedidos</a><a href="loja-pontos.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 56px; color: #6B7A75; font-size: 11px; font-weight: 500"><span style="position: relative; display: flex"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B7A75" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1L12 2Z"></path></svg></span>Pontos</a></nav>
</div>
</template>
<script type="text/x-dc" id="logic">
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { step: 0 }; }
  componentDidMount() { this.tick(); }
  componentWillUnmount() { clearInterval(this.t); }
  tick() { clearInterval(this.t); this.t = setInterval(() => { if (this.state.step >= 3) clearInterval(this.t); else this.setState({ step: this.state.step + 1 }); }, 3500); }
  renderVals() {
    const s = this.state.step;
    const S = [
      { t: 'Pedido confirmado', d: 'Pix aprovado na hora', h: '10:31' },
      { t: 'Em separação', d: 'Farmacêutico conferiu a receita', h: '10:34' },
      { t: 'Saiu para entrega', d: 'Anderson está a caminho', h: '10:42' },
      { t: 'Entregue', d: 'Receita conferida na porta', h: '11:05' }
    ];
    const steps = S.map((x, i) => Object.assign({}, x, { notLast: i < 3, h: i <= s ? x.h : '',
      dot: 'width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex: none; ' + (i <= s ? 'background: #0B7A5E' : 'background: #fff; border: 2px solid #C9D3CF'),
      line: 'width: 2px; flex: 1; min-height: 22px; background: ' + (i < s ? '#0B7A5E' : '#E3E9E6'),
      tStyle: 'font-size: 14px; font-weight: ' + (i === s ? '800' : '600') + '; color: ' + (i <= s ? '#10221D' : '#8A9893') }));
    const bars = [0, 1, 2, 3].map(i => ({ style: 'flex: 1; height: 6px; border-radius: 3px; background: ' + (i <= s ? '#0B7A5E' : '#E3E9E6') }));
    const pos = [[76, 150], [76, 150], [196, 86], [296, 22]][s];
    return { steps, bars, headline: ['Pedido confirmado', 'Separando seu pedido', 'A caminho', 'Pedido entregue!'][s],
      eta: ['11:10', '11:08', '11:05', 'Entregue'][s], showRider: s === 2, done: s === 3,
      bikeStyle: 'position: absolute; width: 34px; height: 34px; border-radius: 50%; background: #0B7A5E; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 6px rgba(11,122,94,0.2); transition: left 1.2s, top 1.2s; left: ' + pos[0] + 'px; top: ' + pos[1] + 'px; opacity: ' + (s >= 2 ? 1 : 0),
      restart: () => { this.setState({ step: 0 }); this.tick(); } };
  }
}
</script>
<script src="dc-runtime.js"></script>
<script>bootDC();</script>
</body>
</html>
