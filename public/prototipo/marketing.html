<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;color:#12201A;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
a{color:#276A2C;text-decoration:none}a:hover{color:#1B4F1F}
button{font-family:inherit}input,select{font-family:inherit}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid #3E9B44;outline-offset:2px}
a,button{transition:background-color .2s ease,color .2s ease,border-color .2s ease,box-shadow .25s ease,transform .18s ease}
button:active,a:active{transform:scale(.97)}
@keyframes fxUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fxIn{from{opacity:0}to{opacity:1}}
@keyframes fxGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fxDraw{to{stroke-dashoffset:0}}
@keyframes fxPulse{0%{box-shadow:0 0 0 0 rgba(62,155,68,.55)}70%{box-shadow:0 0 0 12px rgba(62,155,68,0)}100%{box-shadow:0 0 0 0 rgba(62,155,68,0)}}
@keyframes fxShine{from{transform:translateX(-120%) skewX(-18deg)}to{transform:translateX(320%) skewX(-18deg)}}
@keyframes fxFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
main>*{animation:fxUp .7s cubic-bezier(.2,.7,.2,1) both}
main>*:nth-child(2){animation-delay:.06s}main>*:nth-child(3){animation-delay:.12s}main>*:nth-child(4){animation-delay:.18s}main>*:nth-child(5){animation-delay:.24s}main>*:nth-child(6){animation-delay:.3s}main>*:nth-child(7){animation-delay:.36s}
main section{box-shadow:0 1px 2px rgba(16,34,29,.04),0 10px 30px -18px rgba(16,34,29,.22);transition:box-shadow .3s ease,transform .3s ease,border-color .3s ease}
main section:hover{box-shadow:0 2px 4px rgba(16,34,29,.05),0 22px 44px -20px rgba(16,34,29,.30);border-color:#D9D7CC !important}
.lift:hover{transform:translateY(-3px)}
article{transition:transform .25s ease,box-shadow .25s ease}article:hover{transform:translateY(-3px);box-shadow:0 18px 32px -18px rgba(16,34,29,.35)}
.fx-grow{transform-origin:left center;animation:fxGrow 1.1s cubic-bezier(.2,.7,.2,1) .25s both}
.fx-draw{stroke-dasharray:1;stroke-dashoffset:1;animation:fxDraw 1.6s cubic-bezier(.4,.1,.2,1) .3s forwards}
.fx-fade{animation:fxIn 1.2s ease .5s both}
.fx-live{animation:fxPulse 2s infinite}
.fx-float{animation:fxFloat 4s ease-in-out infinite}
.fx-shine{position:relative;overflow:hidden}.fx-shine::after{content:"";position:absolute;top:0;bottom:0;left:0;width:30%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);animation:fxShine 3.6s ease-in-out 1s infinite}
path.morph{transition:d .7s cubic-bezier(.2,.7,.2,1)}
.nav-a{color:#BED5C0}.nav-a:hover{color:#fff;background:rgba(255,255,255,0.07)}
.row-h{transition:background-color .15s}.row-h:hover{background:#F5F8F1}
.btn-p{background:linear-gradient(180deg,#31803A,#276A2C) !important;box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 8px 18px -8px rgba(39,106,44,.7)}
.btn-p:hover{box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 12px 24px -8px rgba(39,106,44,.85);color:#fff !important;transform:translateY(-1px)}
.btn-g:hover{background:#F1F5F3 !important;border-color:#D6D4C9 !important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}.fx-draw{stroke-dashoffset:0}}

</style>
