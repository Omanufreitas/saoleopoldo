<style>

@keyframes fxFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

main>*:nth-child(2){animation-delay:.06s}main>*:nth-child(3){animation-delay:.12s}main>*:nth-child(4){animation-delay:.18s}main>*:nth-child(5){animation-delay:.24s}main>*:nth-child(6){animation-delay:.3s}main>*:nth-child(7){animation-delay:.36s}

.fx-fade{animation:fxIn 1.2s ease .5s both}
.fx-live{animation:fxPulse 2s infinite}

.fx-shine{position:relative;overflow:hidden}.fx-shine::after{content:"";position:absolute;top:0;bottom:0;left:0;width:30%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);animation:fxShine 3.6s ease-in-out 1s infinite}

<div style="display: flex; gap: 10px; align-items: center; font-size: 13px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#276A2C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M7 2h10v20H7z M11 18h2"></path></svg><span><strong>Pontos em dobro</strong> comprando pelo app</span></div>
<div style="display: flex; gap: 10px; align-items: center; font-size: 13px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#276A2C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M17 2l4 4-4 4 M3 11V9a3 3 0 0 1 3-3h15 M7 22l-4-4 4-4 M21 13v2a3 3 0 0 1-3 3H3"></path></svg><span><strong>+50 por mês</strong> com compra recorrente ativa</span></div>
<div style="display: flex; gap: 10px; align-items: center; font-size: 13px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#276A2C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M16 20v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2 M9 10a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z M22 20v-2a4 4 0 0 0-3-3.87 M16 2.13a4 4 0 0 1 0 7.75"></path></svg><span><strong>+300</strong> por amigo indicado que comprar</span></div></section>
<section style="background: #fff; border: 1px solid #E7E6DE; border-radius: 16px; padding: 14px 14px 4px">
<h2 style="margin: 0 0 6px; font-size: 15px; font-weight: 800">Extrato</h2><div style="display: flex; justify-content: space-between; padding: 10px 0; border-top: 1px solid #E7E6DE; font-size: 13px"><div><div style="font-weight: 600">Pedido #48231</div><div style="color: #56645A">24/11</div></div><strong style="color: #276A2C">+186</strong></div><div style="display: flex; justify-content: space-between; padding: 10px 0; border-top: 1px solid #E7E6DE; font-size: 13px"><div><div style="font-weight: 600">Resgate · frete grátis</div><div style="color: #56645A">18/11</div></div><strong style="color: #12201A">-150</strong></div><div style="display: flex; justify-content: space-between; padding: 10px 0; border-top: 1px solid #E7E6DE; font-size: 13px"><div><div style="font-weight: 600">Pedido #48102</div><div style="color: #56645A">18/11</div></div><strong style="color: #276A2C">+174</strong></div><div style="display: flex; justify-content: space-between; padding: 10px 0; border-top: 1px solid #E7E6DE; font-size: 13px"><div><div style="font-weight: 600">Bônus aniversário</div><div style="color: #56645A">05/11</div></div><strong style="color: #276A2C">+200</strong></div></section>

<nav class="tb" aria-label="Navegação da loja" style="display: flex; border-top: 1px solid #E7E6DE; background: #fff; padding: 4px 6px 14px"><a href="loja.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 56px; color: #6B7A75; font-size: 11px; font-weight: 500"><span class="" style="position: relative; display: flex"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B7A75" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"></path></svg></span>Início</a><a href="loja-busca.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 56px; color: #6B7A75; font-size: 11px; font-weight: 500"><span class="" style="position: relative; display: flex"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B7A75" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16Z M21 21l-4.35-4.35"></path></svg></span>Buscar</a><a href="loja-carrinho.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 56px; color: #6B7A75; font-size: 11px; font-weight: 500"><span class="" style="position: relative; display: flex"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B7A75" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M3 3h2l2.4 12.2a1 1 0 0 0 1 .8h9.7a1 1 0 0 0 1-.76L21 8H6 M9 21a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z M18 21a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z"></path></svg><span style="position: absolute; top: -4px; right: -9px; background: #C22A26; color: #fff; font-size: 10px; font-weight: 700; min-width: 16px; height: 16px; border-radius: 8px; display: flex; align-items: center; justify-content: center">3</span></span>Carrinho</a><a href="loja-pedido.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 56px; color: #6B7A75; font-size: 11px; font-weight: 500"><span class="" style="position: relative; display: flex"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B7A75" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M6 7h12l1 14H5L6 7Z M9 7a3 3 0 0 1 6 0"></path></svg></span>Pedidos</a><a href="loja-pontos.html" aria-current="page" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 56px; color: #276A2C; font-size: 11px; font-weight: 700"><span class="tab-on" style="position: relative; display: flex"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#276A2C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1L12 2Z"></path></svg></span>Pontos</a></nav>

<script type="text/x-dc" id="logic">
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { bal: 2340, used: {}, msg: '' }; }
  renderVals() {
    const R = [{"t": "R$ 5 de desconto", "c": 100, "s": "em qualquer compra"}, {"t": "Frete grátis", "c": 150, "s": "1 entrega sem taxa"}, {"t": "R$ 25 de desconto", "c": 500, "s": "acima de R$ 80"}, {"t": "Aferição de pressão grátis", "c": 300, "s": "em qualquer unidade"}];
    const { bal, used, msg } = this.state;
    const rew = R.map((r, i) => { const u = !!used[i]; const can = bal >= r.c && !u;
      return Object.assign({}, r, { btn: u ? 'Resgatado' : 'Trocar',
        style: 'border: 0; border-radius: 10px; padding: 0 14px; min-height: 40px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; ' + (u ? 'background: #E7F2E2; color: #1B4F1F' : (can ? 'background: #276A2C; color: #fff' : 'background: #EFEEE7; color: #8A9893')),
        go: () => { if (!can) return; this.setState({ bal: bal - r.c, used: Object.assign({}, used, { [i]: true }), msg: r.t + ' adicionado ao seu próximo pedido' }); } }); });
    return { rew, bal: bal.toLocaleString('pt-BR'), brl: 'R$ ' + (bal / 20).toFixed(2).replace('.', ','), msg: !!msg, msgText: msg };
  }
}
</script>
