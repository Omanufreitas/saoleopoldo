<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>SL Digital Protótipo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: barra de modo fixa no topo; Loja = vitrine mobile-first em coluna de 1200px; Painel = sidebar + área de trabalho */
:root{
  --bg:#F4F7F4; --surface:#FFFFFF; --surface-2:#EBF1EC; --surface-3:#DFE8E1; --ink:#13201A; --muted:#5A6A60; --line:#D9E2DB;
  --red:#D8202A; --red-soft:#FDE8E8; --green:#009848; --green-ink:#007A3A; --green-soft:#DFF3E7; --yellow:#F8E000; --yellow-soft:#FFF9C7;
  --amber:#A86200; --amber-soft:#FFF0D4; --blue:#2563EB; --blue-soft:#E3ECFF;
  --shadow:0 1px 2px rgba(19,32,26,.06),0 8px 24px -12px rgba(19,32,26,.18);
  --shadow-lg:0 24px 60px -20px rgba(19,32,26,.35);
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --pack-bg:#FFFFFF; color-scheme:light;
}
:root,:root[data-theme]{color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
:where(svg:not([class]):not([width])){width:18px;height:18px;flex-shrink:0}
.pkv{width:100%;height:auto;display:block}
.hero .eta svg{width:30px;height:30px}
.hero .eta span{white-space:nowrap}
.alert .ai svg{width:18px;height:18px}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:#13201A}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--green);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{font-family:var(--display);margin:0;line-height:1.1;text-wrap:balance}
p{margin:0}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1200px;margin:0 auto}

/* ===== barra de modo ===== */
.modebar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:#13201A;color:#F4F7F4;box-shadow:0 2px 12px rgba(0,0,0,.15)}
.modebar .in{display:flex;align-items:center;gap:12px;height:52px;max-width:1400px;margin:0 auto}
.modebar .tag{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:#B9C8BF;white-space:nowrap}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;background:#2A3A31;border:1px solid #3B4F44;border-radius:999px;padding:4px;margin-inline:auto}
.seg button{position:relative;z-index:1;color:#FFFFFF;font-weight:600;font-size:.86rem;padding:6px 16px;border-radius:999px;white-space:nowrap;display:flex;gap:6px;align-items:center;justify-content:center;transition:color .3s}
.seg button[aria-pressed="true"]{color:#13201A}
.seg button[aria-pressed="false"]:hover{background:rgba(255,255,255,.08)}
.seg .knob{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);background:#F8E000;border-radius:999px;transition:transform .45s cubic-bezier(.7,-0.2,.3,1.3);box-shadow:0 4px 14px rgba(248,224,0,.35)}
.seg.admin .knob{transform:translateX(100%);background:#FFFFFF}
.modebar .hint{font-size:.75rem;color:#B9C8BF;white-space:nowrap}
@media (max-width:700px){.modebar .tag,.modebar .hint{display:none}.seg button{padding:6px 12px}}

/* ===== LOJA ===== */
.s-head{position:sticky;top:calc(env(safe-area-inset-top,0px) + 52px);z-index:40;background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--line)}
.s-head .row1{display:flex;align-items:center;gap:14px;height:68px}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer;flex-shrink:0}
.logo svg{width:40px;height:40px;filter:drop-shadow(0 4px 8px rgba(216,32,42,.25))}
.logo .wm{display:grid;line-height:1}
.logo .wm small{font-family:var(--mono);font-size:.6rem;letter-spacing:.22em;color:var(--red);font-weight:600}
.logo .wm b{font-family:var(--display);font-size:1.18rem;font-weight:800;color:var(--green-ink);letter-spacing:-.01em}
.loc{display:flex;align-items:center;gap:8px;background:var(--green-soft);color:var(--green-ink);padding:7px 12px;border-radius:12px;font-size:.8rem;font-weight:600;white-space:nowrap}
.loc .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 var(--green);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.loc small{display:block;font-weight:500;opacity:.8;font-size:.7rem}
.search{position:relative;flex:1;min-width:0}
.search input{width:100%;height:46px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);padding:0 46px 0 44px;font-size:.95rem;transition:border-color .2s, box-shadow .2s}
.search input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 4px color-mix(in srgb,var(--green) 18%,transparent)}
.search .ic{position:absolute;left:14px;top:50%;translate:0 -50%;width:18px;height:18px;color:var(--muted)}
.search .scan{position:absolute;right:6px;top:50%;translate:0 -50%;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--green-ink);background:var(--green-soft)}
.s-icons{display:flex;gap:4px;flex-shrink:0}
.ibtn{position:relative;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--ink);transition:background .2s}
.ibtn:hover{background:var(--surface-2)}
.ibtn svg{width:22px;height:22px}
.ibtn .cnt{position:absolute;top:4px;right:3px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:.7rem;font-weight:700;display:grid;place-items:center}
.ibtn .cnt.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.5)}60%{transform:scale(.9)}}
.s-nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.s-nav::-webkit-scrollbar{display:none}
.s-nav button{white-space:nowrap;font-size:.84rem;font-weight:600;padding:6px 12px;border-radius:999px;color:var(--muted);transition:all .2s}
.s-nav button:hover,.s-nav button.on{background:var(--ink);color:var(--bg)}
@media (max-width:820px){.loc{display:none}.s-head .row1{gap:8px}.logo .wm{display:none}}

/* mega menu */
.s-head .wrap{position:relative}
.s-nav{align-items:center}
.s-nav .dp{display:inline-flex;align-items:center;gap:4px}
.s-nav .dp svg{width:14px;height:14px;transition:transform .25s}
.s-nav .dp.open{background:var(--ink);color:#fff}
.s-nav .dp.open svg{transform:rotate(180deg)}
.s-nav .hot{color:var(--red)}
.s-nav .hot:hover,.s-nav .hot.on{background:var(--red);color:#fff}
.mega{position:absolute;left:0;right:0;top:calc(100% + 1px);background:rgba(255,255,255,.93);border:1px solid var(--line);border-top:0;border-radius:0 0 28px 28px;box-shadow:0 40px 80px -30px rgba(19,32,26,.45),0 1px 0 rgba(255,255,255,.8) inset;padding:20px 24px 24px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) 300px;grid-template-rows:auto 1fr;column-gap:26px;row-gap:16px;z-index:44;transform-origin:top center}
.mega.enter{animation:megaIn .34s cubic-bezier(.2,.8,.2,1) both}
.mega.swap>*{animation:megaCol .28s ease both}
@keyframes megaIn{from{opacity:0;transform:translateY(-14px) scaleY(.97);filter:blur(4px)}}
@keyframes megaCol{from{opacity:0;transform:translateY(10px)}}
.mega.enter>*{animation:megaCol .42s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*55ms + 80ms)}
.mega .mchips{grid-column:1/4;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px dashed var(--line)}
.mega .mchips span{font-family:var(--mono);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-right:4px}
.mega .mchips button{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);font-size:.8rem;font-weight:600;background:var(--surface);transition:transform .2s,background .2s,border-color .2s,color .2s}
.mega .mchips button i{width:8px;height:8px;border-radius:50%;background:var(--cc)}
.mega .mchips button:hover{transform:translateY(-2px);border-color:var(--cc);background:color-mix(in srgb,var(--cc) 12%,#fff);color:var(--ink)}
.mega h5{font-family:var(--mono);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 8px 10px;font-weight:600}
.mega .grp{display:grid;gap:1px;align-content:start;position:relative;z-index:1}
.mega .grp button{position:relative;z-index:1;text-align:left;padding:6px 10px;border-radius:12px;font-size:.88rem;font-weight:500;display:flex;gap:10px;align-items:center;transition:color .15s}
.mega .grp button .mi{flex:none;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--cs);color:var(--cc);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.mega .grp button .mi svg{width:15px;height:15px}
.mega .grp button .nm{flex:1;min-width:0}
.mega .grp button small{color:var(--muted);font-size:.7rem;font-family:var(--mono)}
.mega .grp button:hover,.mega .grp button.hv{color:var(--ink)}
.mega .grp button.hv .mi{transform:scale(1.12) rotate(-6deg)}
.mega .all{margin-top:4px;font-weight:700!important;color:var(--green-ink)}
.mega .mpill{position:absolute;left:0;top:0;border-radius:12px;background:var(--pc,var(--green-soft));box-shadow:0 6px 16px -10px rgba(19,32,26,.4);pointer-events:none;opacity:0;transition:transform .28s cubic-bezier(.3,1.2,.4,1),width .28s,height .28s,opacity .2s,background .3s;z-index:0}
.mega .mside{grid-column:4;grid-row:1/3;display:grid;gap:12px;align-content:start}
.mega .mban{position:relative;overflow:hidden;border-radius:22px;padding:16px 16px 0;min-height:186px;background:linear-gradient(150deg,var(--bs,#fff),#fff 92%);border:1px solid color-mix(in srgb,var(--bc) 22%,transparent);cursor:pointer;display:grid;align-content:start;gap:4px;transition:transform .25s}
.mega .mban:hover{transform:translateY(-2px)}
.mega .mban:after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:var(--bc);opacity:.12}
.mega .mban .tg{font-family:var(--mono);font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;color:var(--bc);font-weight:700}
.mega .mban b{font-family:var(--display);font-size:1.25rem;line-height:1.1;letter-spacing:-.01em}
.mega .mban p{margin:0;font-size:.78rem;color:var(--muted)}
.mega .mban .go{font-size:.78rem;font-weight:700;color:var(--bc);display:inline-flex;gap:4px;align-items:center}
.mega .mban .go svg{width:13px;height:13px;transform:rotate(-90deg)}
.mega .mban .row{display:flex;justify-content:center;align-items:flex-end;margin-top:6px;height:84px}
.mega .mban .row .pk{width:70px;margin:0 -8px;filter:drop-shadow(0 12px 12px rgba(0,0,0,.18));transition:transform .45s cubic-bezier(.3,1.4,.5,1)}
.mega .mban .row .pk:nth-child(2){width:84px;z-index:1}
.mega .mban:hover .row .pk:nth-child(1){transform:rotate(-8deg) translateX(-4px)}
.mega .mban:hover .row .pk:nth-child(3){transform:rotate(8deg) translateX(4px)}
.mega .mban .in{animation:banIn .35s cubic-bezier(.2,.8,.2,1) both;display:contents}
.mega .mban.ch>*{animation:banIn .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes banIn{from{opacity:0;transform:translateX(12px)}}
.mega .mbest h5{margin:2px 0 6px 2px}
.mega .mmini{display:flex;align-items:center;gap:10px;padding:6px 8px 6px 6px;border-radius:14px;cursor:pointer;transition:background .2s}
.mega .mmini:hover{background:var(--surface-2)}
.mega .mmini .pk{width:40px;flex:none}
.mega .mmini .tx{flex:1;min-width:0;display:grid;line-height:1.2}
.mega .mmini .tx span{font-size:.78rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mega .mmini .tx em{font-style:normal;font-family:var(--display);font-weight:800;font-size:.92rem;color:var(--red)}
.mega .mmini .tx em s{color:var(--muted);font-weight:500;font-size:.72rem;margin-left:4px;font-family:var(--body,inherit)}
.mega .mmini .ad{flex:none;font-size:.72rem;font-weight:700;padding:6px 10px;border-radius:99px;background:var(--green);color:#fff;transition:transform .2s,background .2s}
.mega .mmini .ad:hover{transform:scale(1.06);background:var(--green-ink)}
.mdim{position:fixed;inset:0;z-index:39;background:rgba(19,32,26,.32);backdrop-filter:blur(3px) saturate(.9);-webkit-backdrop-filter:blur(3px) saturate(.9);opacity:0;pointer-events:none;transition:opacity .3s}
.mdim.on{opacity:1;pointer-events:auto}
@media (max-width:900px){.mega{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:16px;max-height:70vh;overflow:auto}.mega .mchips{grid-column:1/-1}.mega .mside{display:none}.mega .mpill{display:none}}
@media (prefers-reduced-motion:reduce){.mega.enter,.mega.enter>*,.mega.swap>*,.mega .mban.ch>*{animation:none}}
/* dropdown busca */
.sdrop{position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-lg);padding:10px;max-height:min(70vh,560px);overflow:auto;z-index:45;animation:pop .22s ease}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.98)}}
.sdrop h5{font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:8px 8px 6px;font-weight:600}
.sres{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:8px;border-radius:12px;cursor:pointer;width:100%;text-align:left}
.sres:hover,.sres.act{background:var(--surface-2)}
.sres .t{font-weight:600;font-size:.9rem}
.sres .t mark{background:var(--yellow-soft);color:inherit;border-radius:3px}
.sres small{color:var(--muted);font-size:.76rem}
.sres .p{font-family:var(--display);font-weight:800}
.schips{display:flex;flex-wrap:wrap;gap:6px;padding:0 8px 6px}
.schip{font-size:.8rem;padding:5px 10px;border-radius:999px;background:var(--surface-2);font-weight:500}
.schip:hover{background:var(--green-soft);color:var(--green-ink)}
.sk{height:56px;border-radius:12px;margin:6px 0;background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface-3) 50%,var(--surface-2) 75%);background-size:200% 100%;animation:shim 1s linear infinite}
@keyframes shim{to{background-position:-200% 0}}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:28px;margin-top:22px;background:var(--green-ink);color:#fff;isolation:isolate;min-height:300px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.hero .blob{position:absolute;border-radius:50%;filter:blur(50px);opacity:.75;z-index:-1;animation:float 14s ease-in-out infinite alternate}
.hero .b1{width:420px;height:420px;background:#00B85A;left:-120px;top:-160px}
.hero .b2{width:360px;height:360px;background:#F8E000;right:-80px;bottom:-200px;opacity:.55;animation-delay:-5s}
.hero .b3{width:260px;height:260px;background:#D8202A;right:24%;top:-140px;opacity:.5;animation-delay:-9s}
@keyframes float{to{transform:translate(60px,40px) scale(1.15)}}
.hero .grain{position:absolute;inset:0;z-index:-1;opacity:.12;background-image:radial-gradient(rgba(255,255,255,.7) 1px,transparent 1px);background-size:18px 18px;mask-image:linear-gradient(90deg,#000,transparent 70%)}
.hero .copy{padding:40px 40px 36px;display:grid;gap:16px;align-content:center}
.hero .kick{display:inline-flex;gap:8px;align-items:center;font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;background:rgba(0,0,0,.2);padding:6px 12px;border-radius:999px;justify-self:start}
.hero h1{font-size:clamp(2rem,4.4vw,3.4rem);font-weight:800;letter-spacing:-.025em}
.hero h1 em{font-style:normal;color:#F8E000}
.hero p{font-size:1.05rem;opacity:.92;max-width:44ch}
.hero .ctas{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 20px;border-radius:14px;font-weight:700;font-size:.92rem;transition:transform .15s, box-shadow .2s, background .2s}
.btn:active{transform:scale(.97)}
.btn.y{background:#F8E000;color:#13201A;box-shadow:0 8px 20px -8px rgba(248,224,0,.7)}
.btn.y:hover{box-shadow:0 12px 26px -8px rgba(248,224,0,.9)}
.btn.ghost{background:rgba(255,255,255,.14);color:#fff}
.btn.g{background:var(--green);color:#fff;box-shadow:0 8px 20px -10px var(--green)}
.btn.g:hover{background:var(--green-ink)}
.btn.line{border:1.5px solid var(--line);background:var(--surface)}
.btn.full{width:100%}
.hero .stage{position:relative;display:grid;place-items:center;min-height:260px}
.hero .stage .pk{position:absolute;transition:transform .6s}
.hero .stage .pk svg{filter:drop-shadow(0 24px 24px rgba(0,0,0,.35))}
.hero .stage .p1{width:46%;left:10%;top:16%;transform:rotate(-8deg);animation:bob 6s ease-in-out infinite}
.hero .stage .p2{width:40%;right:8%;top:8%;transform:rotate(7deg);animation:bob 7s ease-in-out -2s infinite}
.hero .stage .p3{width:34%;left:38%;bottom:4%;transform:rotate(-2deg);animation:bob 5s ease-in-out -1s infinite}
@keyframes bob{50%{translate:0 -10px}}
.hero .eta{position:absolute;right:20px;bottom:20px;background:#fff;color:#13201A;border-radius:16px;padding:10px 14px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow-lg);font-size:.8rem}
.hero .eta b{font-family:var(--display);font-size:1.3rem;color:var(--red)}
@media (max-width:820px){.hero{grid-template-columns:minmax(0,1fr)}.hero .copy{padding:28px 22px 8px}.hero .stage{min-height:220px}}

.perks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
.perk{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;font-size:.82rem}
.perk svg{width:28px;height:28px;color:var(--green);flex-shrink:0}
.perk b{display:block;font-size:.88rem}
@media (max-width:820px){.perks{grid-template-columns:repeat(2,minmax(0,1fr))}}

.sec{margin-top:44px;display:grid;gap:16px}
.sec-h{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-h h2{font-size:clamp(1.35rem,2.6vw,1.8rem);font-weight:800;letter-spacing:-.015em}
.sec-h a,.link{color:var(--green-ink);font-weight:600;font-size:.88rem;cursor:pointer;text-decoration:none}

.needs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:900px){.needs{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:520px){.needs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.need{position:relative;overflow:hidden;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:grid;gap:22px;transition:transform .25s, box-shadow .25s, border-color .25s}
.need:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:transparent}
.need .ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--c-soft,var(--green-soft));color:var(--c,var(--green-ink));transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.need:hover .ico{transform:rotate(-8deg) scale(1.08)}
.need .ico svg{width:26px;height:26px}
.need b{font-family:var(--display);font-size:1.02rem;font-weight:700}
.need small{display:block;color:var(--muted);font-size:.76rem;font-weight:500;margin-top:2px}

.grid-p{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px;display:grid;gap:8px;grid-template-rows:auto 1fr auto;transition:transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s, border-color .3s;cursor:pointer;min-width:0}

.card .img .pk{width:66%;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.card:hover .img .pk{transform:translateY(-6px) rotate(-3deg) scale(1.05)}
.card .img::after{content:"";position:absolute;bottom:12%;left:25%;right:25%;height:10px;border-radius:50%;background:rgba(19,32,26,.18);filter:blur(6px);transition:transform .45s}

.card .off{position:absolute;top:10px;left:10px;background:var(--red);color:#fff;font-weight:700;font-size:.72rem;padding:3px 8px;border-radius:8px;z-index:1}

.card .fav svg{width:16px;height:16px}
.card .meta{display:grid;gap:3px;align-content:start}
.card .mk{font-size:.72rem;color:var(--muted);font-weight:500}
.card .nm{font-weight:600;font-size:.9rem;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .bt{display:flex;align-items:end;justify-content:space-between;gap:8px}
.card .pr{display:grid;line-height:1.1}
.card .pr s{font-size:.75rem;color:var(--muted)}
.card .pr b{font-family:var(--display);font-size:1.25rem;font-weight:800}
.card .add{width:42px;height:42px;border-radius:13px;background:var(--green);color:#fff;display:grid;place-items:center;transition:transform .2s, background .2s;flex-shrink:0}

.card .add svg{width:20px;height:20px}
.card .avail{font-size:.72rem;color:var(--green-ink);font-weight:600;display:flex;gap:5px;align-items:center}

.badges{display:flex;gap:4px;flex-wrap:wrap}
.bd{font-family:var(--mono);font-size:.62rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:5px;background:var(--surface-2);color:var(--muted)}

.bd.ref{background:var(--blue-soft);color:var(--blue)}

.promo2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}

.pban{position:relative;overflow:hidden;border-radius:24px;padding:26px;min-height:190px;display:grid;align-content:space-between;gap:16px;isolation:isolate}

.pban .pk{position:absolute;right:-10px;bottom:-24px;width:44%;z-index:-1;transform:rotate(10deg);transition:transform .5s}
.pban:hover .pk{transform:rotate(2deg) translateY(-8px)}
.pban .btn{justify-self:start;height:40px}
.pban.a .btn{background:#13201A;color:#F8E000}

.stores{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.store{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:8px}
.store .top{display:flex;justify-content:space-between;gap:8px;align-items:start}
.store b{font-family:var(--display);font-size:1.05rem}
.open{font-size:.72rem;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--green-soft);color:var(--green-ink);white-space:nowrap}

.s-foot{margin-top:64px;border-top:1px solid var(--line);padding-block:28px 40px;display:flex;gap:20px;justify-content:space-between;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}

/* categoria */
.cat-head{margin-top:24px;display:grid;gap:14px}

/* sheet / drawer */
.scrim{position:fixed;inset:0;background:rgba(10,16,13,.5);backdrop-filter:blur(4px);z-index:70;animation:fade .25s}

@keyframes rise{from{opacity:0;transform:translateY(30px) scale(.97)}}

.save{display:flex;gap:12px;align-items:center;background:var(--yellow-soft);border-radius:16px;padding:12px 14px;font-size:.85rem;cursor:pointer;border:1px solid color-mix(in srgb,var(--yellow) 60%,transparent)}
.save .pk{width:44px;flex-shrink:0}
.save b{color:var(--ink)}
.qty{display:flex;align-items:center;background:var(--surface-2);border-radius:14px;height:50px}

.buy{display:flex;gap:10px}
.buy .btn{flex:1;height:50px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}

.tabbody{font-size:.9rem;color:var(--muted);min-height:64px}
.srcs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

.av{display:grid;gap:6px}
.av .r{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:12px;background:var(--surface-2);font-size:.84rem}
.av .r.best{background:var(--green-soft)}
.av .r .st{font-weight:700;font-size:.76rem}
.av .r .st.lo{color:var(--amber)}

.dr-h{display:flex;justify-content:space-between;align-items:center;padding:20px 20px 12px}
.dr-h h3{font-size:1.4rem;font-weight:800}
.dr-b{overflow:auto;padding:4px 20px;display:grid;gap:10px;align-content:start}
.dr-f{padding:16px 20px 20px;border-top:1px solid var(--line);display:grid;gap:12px}
.li{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;background:var(--surface-2);border-radius:16px;padding:10px;animation:pop .3s}
.li .th{aspect-ratio:1;border-radius:12px;background:var(--surface);display:grid;place-items:center}
.li .th .pk{width:70%}
.li b{font-size:.86rem;font-weight:600;line-height:1.25;display:block}
.li small{color:var(--muted);font-size:.74rem}
.li .q{display:flex;align-items:center;gap:2px;background:var(--surface);border-radius:10px}
.li .q button{width:28px;height:30px;font-weight:700}

.tot{display:flex;justify-content:space-between;font-size:.9rem}
.tot.big{font-size:1.1rem;font-weight:700}
.tot.big b{font-family:var(--display);font-size:1.5rem}
.prog{height:8px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#7BE495);border-radius:4px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.empty{text-align:center;padding:40px 10px;display:grid;gap:10px;justify-items:center;color:var(--muted)}
.empty .pk{width:90px;opacity:.6}

/* checkout */
.co{display:grid;gap:14px}
.opt2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:1.5px solid var(--line);border-radius:14px;padding:12px;text-align:left;display:grid;gap:2px;font-size:.8rem;color:var(--muted);transition:all .2s;background:var(--surface)}
.opt b{color:var(--ink);font-size:.92rem}
.opt.on{border-color:var(--green);background:var(--green-soft)}
.co select{width:100%;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:0 12px}
.pix{display:grid;justify-items:center;gap:12px;text-align:center;padding:8px 0}
.pix .qr{width:200px;height:200px;padding:12px;background:#fff;border-radius:18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.pix .qr::after{content:"";position:absolute;left:0;right:0;height:40px;background:linear-gradient(180deg,transparent,rgba(0,152,72,.35),transparent);animation:scanl 2.2s ease-in-out infinite}
@keyframes scanl{0%{top:-40px}100%{top:100%}}
.pix code{font-family:var(--mono);font-size:.7rem;background:var(--surface-2);padding:8px 10px;border-radius:10px;word-break:break-all;max-width:320px}
.track{display:grid;gap:0}
.tstep{display:grid;grid-template-columns:36px 1fr;gap:12px;position:relative;padding-bottom:22px}
.tstep::before{content:"";position:absolute;left:17px;top:34px;bottom:0;width:2px;background:var(--line)}
.tstep:last-child::before{display:none}
.tstep .c{width:36px;height:36px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);transition:all .4s}
.tstep .c svg{width:18px;height:18px}
.tstep.done .c{background:var(--green);color:#fff}
.tstep.now .c{background:var(--yellow);color:#13201A;box-shadow:0 0 0 6px color-mix(in srgb,var(--yellow) 30%,transparent);animation:pulse2 1.6s infinite}

.tstep b{display:block;font-size:.95rem}
.tstep small{color:var(--muted);font-size:.8rem}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));translate:-50% 0;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;font-size:.88rem;z-index:90;box-shadow:var(--shadow-lg);display:flex;gap:10px;align-items:center;animation:toast 2.6s forwards}
@keyframes toast{0%{opacity:0;transform:translateY(20px)}10%,85%{opacity:1;transform:none}100%{opacity:0;transform:translateY(10px)}}
.flyer{position:fixed;z-index:95;pointer-events:none}

/* ===== PAINEL ===== */
.adm{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 48px)}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 52px);height:calc(100vh - 52px - env(safe-area-inset-top,0px));background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;display:grid;grid-template-rows:auto auto 1fr auto;gap:16px}
.side .logo{padding:0 8px}

.kbar{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:12px;background:var(--surface-2);color:var(--muted);font-size:.82rem;width:100%;text-align:left}
.kbar kbd{margin-left:auto;font-family:var(--mono);font-size:.68rem;background:var(--surface);border:1px solid var(--line);padding:1px 6px;border-radius:5px}
.snav{display:grid;gap:2px;align-content:start}
.snav button{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:11px;font-weight:600;font-size:.88rem;color:var(--muted);text-align:left;position:relative;transition:background .2s,color .2s}
.snav button svg{width:18px;height:18px;flex-shrink:0}
.snav button:hover{background:var(--surface-2);color:var(--ink)}

.side .me{display:flex;gap:10px;align-items:center;padding:10px;border-radius:14px;background:var(--surface-2);font-size:.8rem}
.ava{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--green),var(--yellow));display:grid;place-items:center;color:#13201A;font-weight:800;font-size:.8rem;flex-shrink:0}
@media (max-width:900px){
  .adm{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;height:auto;grid-template-rows:auto;grid-auto-flow:column;grid-template-columns:auto minmax(0,1fr);padding:8px 12px;border-right:0;border-bottom:1px solid var(--line);z-index:30;align-items:center}

}

.qa b{font-family:var(--display);font-size:1.05rem}
.qa small{color:var(--muted);font-size:.8rem}
.wiz{position:fixed;left:50%;top:50%;translate:-50% -50%;width:min(620px,calc(100vw - 32px));max-height:calc(100vh - 60px);overflow:auto;background:var(--surface);border-radius:26px;box-shadow:var(--shadow-lg);z-index:71;padding:26px;display:grid;gap:18px;animation:rise .35s cubic-bezier(.2,.9,.2,1)}
.wsteps{display:flex;gap:6px}
.wsteps i{flex:1;height:6px;border-radius:3px;background:var(--surface-3);transition:background .4s}
.wsteps i.on{background:var(--green)}
.wiz h2{font-size:1.5rem;font-weight:800}
.big-in{display:flex;gap:8px}
.big-in input{flex:1;min-width:0;height:56px;border-radius:16px;border:1.5px solid var(--line);background:var(--bg);padding:0 16px;font-family:var(--mono);font-size:1.15rem;letter-spacing:.06em}
.big-in input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.found{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center;background:var(--surface-2);border-radius:18px;padding:14px;animation:pop .35s}
.found .bx{aspect-ratio:1;border-radius:14px;background:var(--surface);display:grid;place-items:center}
.found .bx .pk{width:72%}
.ff{display:grid;gap:8px}
.ff label{display:grid;gap:4px;font-size:.78rem;font-weight:600;color:var(--muted)}
.ff input,.ff select{width:100%;min-width:0;height:42px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:0 12px;font-size:.92rem;color:var(--ink)}
.auto{font-size:.7rem;font-weight:700;color:var(--green-ink);background:var(--green-soft);padding:1px 6px;border-radius:5px;margin-left:6px}
.wact{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.range{width:100%;accent-color:var(--red)}
.offprev{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:center}
@media (max-width:560px){.offprev{grid-template-columns:minmax(0,1fr)}}
.offprev .card{pointer-events:none}
/* kanban */
.kan{display:grid;grid-template-columns:repeat(4,minmax(230px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--surface-2);border-radius:18px;padding:10px;display:grid;gap:8px;align-content:start;min-height:300px;transition:background .2s, outline-color .2s;outline:2px dashed transparent}
.col.over{outline-color:var(--green);background:var(--green-soft)}
.col .ch{display:flex;justify-content:space-between;align-items:center;padding:4px 6px;font-weight:700;font-size:.85rem}
.col .ch span{font-family:var(--mono);font-size:.72rem;background:var(--surface);padding:1px 8px;border-radius:999px}
.ord{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px;cursor:grab;transition:transform .2s, box-shadow .2s;animation:pop .3s}
.ord:hover{box-shadow:var(--shadow)}
.ord.drag{opacity:.4}
.ord .r1{display:flex;justify-content:space-between;font-size:.8rem}
.ord .r1 b{font-family:var(--mono)}
.ord .who{font-weight:600;font-size:.9rem}
.ord .r2{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:.76rem;color:var(--muted)}
.ord .mode{font-size:.68rem;font-weight:700;padding:2px 7px;border-radius:6px}
.ord .mode.ret{background:var(--green-soft);color:var(--green-ink)}
.ord .mode.ent{background:var(--blue-soft);color:var(--blue)}
.ord .rx{font-size:.68rem;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--red-soft);color:var(--red)}
.ord .nx{font-size:.76rem;font-weight:700;color:var(--green-ink);text-align:left}
.ord .timer{font-family:var(--mono);font-size:.72rem}
.ord .timer.late{color:var(--red)}

/* tabela catálogo */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tsearch{flex:1;min-width:200px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:0 12px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.84rem;min-width:860px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-family:var(--mono);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--surface-2);position:sticky;top:0}
tr:last-child td{border-bottom:0}
tbody tr{transition:background .15s}
tbody tr:hover{background:var(--surface-2)}
tbody tr.sel{background:var(--green-soft)}
td .th{width:40px;height:40px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center}
td .th .pk{width:70%}
td .th.none{background:repeating-linear-gradient(45deg,var(--red-soft) 0 6px,var(--surface) 6px 12px);color:var(--red)}
td .th.none svg{width:16px;height:16px}
td .nm{font-weight:600;display:block}
td .raw{font-family:var(--mono);font-size:.7rem;color:var(--muted)}
td.price{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
td.price span[contenteditable]{padding:3px 6px;border-radius:6px;outline:none}
td.price span[contenteditable]:hover{background:var(--surface-3)}
td.price span[contenteditable]:focus{background:var(--yellow-soft);box-shadow:0 0 0 2px var(--yellow)}
.score{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-variant-numeric:tabular-nums}
.score i{width:34px;height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden;display:block}
.score i::after{content:"";display:block;height:100%;width:var(--w);background:var(--c)}
.iss{display:flex;gap:4px;flex-wrap:wrap}
.is{font-size:.66rem;font-weight:700;padding:2px 6px;border-radius:5px;background:var(--red-soft);color:var(--red);white-space:nowrap}
.is.a{background:var(--amber-soft);color:var(--amber)}
.is.ok{background:var(--green-soft);color:var(--green-ink)}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--green)}
.bulk{position:sticky;bottom:calc(16px + env(safe-area-inset-bottom,0px));margin-inline:auto;display:flex;gap:8px;align-items:center;background:var(--ink);color:var(--bg);padding:8px 8px 8px 16px;border-radius:16px;box-shadow:var(--shadow-lg);animation:rise .3s;width:max-content;max-width:100%;flex-wrap:wrap;z-index:20}
.bulk button{background:rgba(255,255,255,.12);color:inherit;padding:8px 12px;border-radius:10px;font-size:.8rem;font-weight:600}
.bulk button.y{background:var(--yellow);color:#13201A}

/* revisão IA */
.rev{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:900px){.rev{grid-template-columns:minmax(0,1fr)}}
.rv{border-radius:20px;padding:18px;display:grid;gap:12px;align-content:start}
.rv.before{background:var(--surface-2);border:1px dashed var(--line)}
.rv.after{background:var(--surface);border:1.5px solid var(--green);box-shadow:0 0 0 5px var(--green-soft)}
.rv .lab{font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.rv.before .lab{color:var(--red)}
.rv.after .lab{color:var(--green-ink);display:flex;gap:6px;align-items:center}
.fld{display:grid;gap:3px}
.fld small{font-size:.7rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.fld .v{font-size:.92rem}
.rv.before .v{font-family:var(--mono);font-size:.82rem}
.rv .imgbox{display:flex;gap:12px;align-items:center}
.rv .imgbox .bx{width:84px;height:84px;border-radius:14px;background:var(--surface);display:grid;place-items:center;border:1px solid var(--line);overflow:hidden}
.rv .imgbox .bx .pk{width:70%}
.typing::after{content:"▍";animation:blink 1s steps(1) infinite;color:var(--green)}
@keyframes blink{50%{opacity:0}}
.rvbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rvbar .btn{height:44px}
.btn.r{background:var(--red-soft);color:var(--red)}
kbd.k{font-family:var(--mono);font-size:.7rem;padding:1px 6px;border-radius:5px;background:rgba(0,0,0,.12);margin-left:4px}
.qprog{display:flex;align-items:center;gap:10px;font-size:.82rem;color:var(--muted)}
.qprog .prog{width:180px}
.conf{display:inline-flex;gap:6px;align-items:center;font-size:.76rem;font-weight:700;color:var(--green-ink);background:var(--green-soft);padding:3px 9px;border-radius:999px}

/* ferramenta imagem */
.drop{border:2px dashed var(--line);border-radius:22px;padding:28px;display:grid;justify-items:center;gap:10px;text-align:center;background:var(--surface);transition:all .2s;cursor:pointer}
.drop.over{border-color:var(--green);background:var(--green-soft);transform:scale(1.01)}
.drop svg{width:44px;height:44px;color:var(--green)}
.drop b{font-family:var(--display);font-size:1.2rem}
.presets{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.ba{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:700px){.ba{grid-template-columns:minmax(0,1fr)}}
.ba figure{margin:0;display:grid;gap:8px}
.ba canvas{width:100%;height:auto;border-radius:16px;border:1px solid var(--line);background:repeating-conic-gradient(var(--surface-2) 0 25%,var(--surface) 0 50%) 0 0/20px 20px;display:block}
.ba figcaption{font-size:.78rem;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.steps{display:grid;gap:6px}
.stp{display:flex;gap:10px;align-items:center;font-size:.84rem;padding:8px 10px;border-radius:10px;background:var(--surface-2);opacity:.45;transition:opacity .3s}
.stp.ok{opacity:1}
.stp.ok .ck{background:var(--green);color:#fff}
.stp .ck{width:22px;height:22px;border-radius:50%;background:var(--surface-3);display:grid;place-items:center;font-size:.7rem;font-weight:800}

/* ERP */
.pipe{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;position:relative}
@media (max-width:1000px){.pipe{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:520px){.pipe{grid-template-columns:repeat(2,minmax(0,1fr))}}
.node{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:6px;position:relative;overflow:hidden}
.node::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:100%;background:linear-gradient(90deg,transparent,var(--green),transparent);transform:translateX(-100%);animation:flow 2.4s linear infinite;animation-delay:var(--d)}
@keyframes flow{to{transform:translateX(100%)}}
.node b{font-family:var(--display);font-size:.98rem}
.node small{font-size:.74rem;color:var(--muted)}
.node .n{font-family:var(--mono);font-size:1.1rem;font-weight:600;font-variant-numeric:tabular-nums}
.log{font-family:var(--mono);font-size:.74rem;background:#0D1310;color:#B8D8C4;border-radius:16px;padding:14px;height:240px;overflow:auto;display:grid;align-content:start;gap:3px}
.log .ok{color:#4BE095}.log .wa{color:#FFD24A}.log .er{color:#FF7A7E}
.log time{color:#5F7A6A;margin-right:8px}

/* vitrine */
.vit{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media (max-width:900px){.vit{grid-template-columns:minmax(0,1fr)}}
.blk{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:grab;transition:box-shadow .2s,transform .2s}
.blk.drag{opacity:.4}
.blk .grip{color:var(--muted);font-size:1.1rem;letter-spacing:-2px}
.blk b{font-size:.9rem}
.blk small{display:block;color:var(--muted);font-size:.76rem}
.sw{margin-left:auto;width:40px;height:24px;border-radius:12px;background:var(--surface-3);position:relative;transition:background .2s;flex-shrink:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
.sw.on{background:var(--green)}
.sw.on::after{transform:translateX(16px)}
.phone{width:100%;max-width:300px;border-radius:36px;border:8px solid var(--ink);background:var(--bg);aspect-ratio:9/18;overflow:hidden;position:sticky;top:120px;display:grid;align-content:start;gap:8px;padding:10px;margin-inline:auto}
.phone .pb{border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:.66rem;padding:8px;display:grid;gap:4px;animation:pop .3s}
.phone .pb.hero2{background:var(--green-ink);color:#fff;min-height:80px;align-content:end;font-family:var(--display);font-weight:800;font-size:.85rem}
.phone .pb.yel{background:var(--yellow);color:#13201A;font-weight:700}
.phone .dots{display:flex;gap:4px}
.phone .dots i{flex:1;aspect-ratio:1;border-radius:6px;background:var(--surface-2)}

/* paleta comando */
.cmd{position:fixed;left:50%;top:14vh;translate:-50% 0;width:min(620px,calc(100vw - 32px));background:var(--surface);border-radius:20px;box-shadow:var(--shadow-lg);z-index:81;overflow:hidden;animation:rise .25s}
.cmd input{width:100%;height:56px;border:0;border-bottom:1px solid var(--line);background:transparent;padding:0 20px;font-size:1.05rem;outline:none}
.cmd .list{max-height:50vh;overflow:auto;padding:8px}
.cmd .it{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;width:100%;text-align:left;font-size:.9rem}
.cmd .it.act{background:var(--surface-2)}
.cmd .it small{margin-left:auto;color:var(--muted);font-size:.74rem}
.cmd .it .pk{width:26px}
.scrim.c{z-index:80}


/* ===== acabamento da loja (v3) ===== */
html{scroll-behavior:smooth}
#store{scrollbar-color:color-mix(in srgb,var(--green) 55%,transparent) transparent}
#store ::-webkit-scrollbar{height:6px;width:8px}
#store ::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--green) 45%,transparent);border-radius:99px}
#store ::-webkit-scrollbar-track{background:transparent}
.annc{background:linear-gradient(90deg,var(--green-ink),#00A653,var(--green-ink));color:#fff;font-size:.8rem;font-weight:600;height:34px;overflow:hidden}
.annc .tr{display:grid;transition:transform .7s cubic-bezier(.7,0,.25,1)}
.annc .tr span{height:34px;display:flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.annc .tr span b{color:#F8E000}
.annc svg{width:16px;height:16px}
.sprog{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 52px);height:3px;z-index:51;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,var(--red),var(--yellow),var(--green));pointer-events:none}
.s-head .row1{transition:height .35s cubic-bezier(.2,.8,.2,1)}
.s-head{transition:box-shadow .35s}
.s-head.shrink{box-shadow:0 14px 30px -24px rgba(19,32,26,.55)}
.s-head.shrink .row1{height:58px}
.hbtn{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:12px;text-align:left;line-height:1.15;transition:background .2s;position:relative}
.hbtn:hover{background:var(--surface-2)}
.hbtn svg{width:22px;height:22px}
.hbtn small{display:block;font-size:.7rem;color:var(--muted)}
.hbtn b{font-size:.82rem;white-space:nowrap}
.hbtn .cnt{position:absolute;top:0;left:22px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:.7rem;font-weight:700;display:grid;place-items:center}
.hbtn .cnt.bump{animation:bump .5s}
@media (max-width:1100px){.hbtn span{display:none}}
/* carrossel hero */
.hcar{position:relative;margin-top:22px;border-radius:28px;overflow:hidden;isolation:isolate;--py:0px;--ho:1}
.htrack{display:flex;transition:transform .9s cubic-bezier(.7,0,.2,1);touch-action:pan-y}
.hcar .hero{flex:0 0 100%;margin:0;border-radius:0}
.hcar .hero .stage{transform:translateY(var(--py))}
.hcar .hero .copy{opacity:var(--ho)}
.hero.y{background:#F8E000;color:#13201A}
.hero.y em{color:var(--red)}
.hero.y .b1{background:#FFFFFF;opacity:.6}.hero.y .b2{background:#00B85A;opacity:.35}.hero.y .b3{background:#FF8A00;opacity:.4}
.hero.y .kick{background:rgba(19,32,26,.1)}
.hero.y .btn.y{background:#13201A;color:#F8E000;box-shadow:none}
.hero.y .btn.ghost{background:rgba(19,32,26,.08);color:#13201A}
.hero.y .grain{background-image:radial-gradient(rgba(19,32,26,.5) 1px,transparent 1px)}
.hero.r{background:#C4141E}
.hero.r .b1{background:#FF4D55}.hero.r .b2{background:#F8E000;opacity:.45}.hero.r .b3{background:#7A0A10;opacity:.6}
.hero .big{position:absolute;right:20px;bottom:20px;background:#fff;color:#13201A;border-radius:18px;padding:10px 16px;box-shadow:var(--shadow-lg);font-size:.78rem;line-height:1.1}
.hero .big b{display:block;font-family:var(--display);font-size:2rem;color:var(--red)}
.hctrl{position:absolute;right:24px;top:22px;display:flex;align-items:center;gap:10px;z-index:3}
.hdots{display:flex;gap:6px;background:rgba(19,32,26,.28);backdrop-filter:blur(8px);padding:7px 9px;border-radius:99px}
.hdots button{width:26px;height:5px;border-radius:3px;background:rgba(255,255,255,.4);overflow:hidden;position:relative;transition:width .4s}
.hdots button.on{width:44px}
.hdots button.on::after{content:"";position:absolute;inset:0;background:#fff;transform-origin:0 50%;animation:fill 6s linear forwards}
.hcar.paused .hdots button.on::after{animation-play-state:paused}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.harr{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.92);color:#13201A;display:grid;place-items:center;box-shadow:0 6px 16px -6px rgba(0,0,0,.4);transition:transform .2s}
.harr:hover{transform:scale(1.08)}
.harr svg{width:18px;height:18px}
@media (max-width:820px){.hctrl{right:16px;top:16px}.harr{display:none}}
/* serviços */
.svc{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-top:22px}
@media (max-width:900px){.svc{grid-auto-flow:column;grid-template-columns:none;grid-auto-columns:120px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}}
.svc button{display:grid;justify-items:center;gap:8px;text-align:center;padding:14px 8px;border-radius:18px;font-size:.8rem;font-weight:600;line-height:1.2;transition:background .2s;scroll-snap-align:start}
.svc button:hover{background:var(--surface)}
.svc .ci{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--green-ink);position:relative;transition:transform .35s cubic-bezier(.3,1.6,.5,1),background .25s,color .25s}
.svc button:hover .ci{transform:translateY(-4px) rotate(-6deg);background:var(--green);color:#fff;border-color:transparent}
.svc .ci svg{width:26px;height:26px}
.svc .ci .nw{position:absolute;top:-6px;right:-10px;font-size:.58rem;font-weight:800;letter-spacing:.04em;background:var(--red);color:#fff;padding:2px 6px;border-radius:6px}
/* trilhos */
.railw{position:relative;display:grid;gap:12px}
.railw .rail{scrollbar-width:none;padding:6px 4px 18px;margin:-6px -4px 0;mask-image:linear-gradient(90deg,transparent 0,#000 24px,#000 calc(100% - 48px),transparent);-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 24px,#000 calc(100% - 48px),transparent);cursor:grab;scroll-behavior:smooth}
.railw .rail::-webkit-scrollbar{display:none}
.railw .rail.drag{cursor:grabbing;scroll-behavior:auto;scroll-snap-type:none}
.railw .rail.drag .card{pointer-events:none}
.rbar{height:4px;border-radius:2px;background:var(--surface-3);overflow:hidden;max-width:220px}
.rbar i{display:block;height:100%;width:30%;border-radius:2px;background:var(--ink);transition:transform .15s linear}
.rarr{display:flex;gap:8px;align-items:center}
.rarr button{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;transition:all .2s}
.rarr button:hover:not(:disabled){background:var(--ink);color:#fff;border-color:var(--ink)}
.rarr button:disabled{opacity:.35;cursor:default}
.rarr svg{width:18px;height:18px}
.sec-h .sub{color:var(--muted);font-size:.9rem;margin-top:4px}
/* extras no card */
.stars{display:flex;align-items:center;gap:4px;font-size:.7rem;color:var(--muted)}

.kits{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}

.kit:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.kit .art{height:200px;position:relative;display:grid;place-items:center;background:var(--k)}
.kit .art .pk{position:absolute;width:min(24%,92px);bottom:18px;transition:transform .5s cubic-bezier(.3,1.4,.5,1);filter:drop-shadow(0 14px 14px rgba(0,0,0,.22))}
.kit .art .pk:nth-child(1){transform:translateX(-62%) rotate(-12deg)}
.kit .art .pk:nth-child(2){transform:translateY(-8px);z-index:1}
.kit .art .pk:nth-child(3){transform:translateX(62%) rotate(12deg)}
.kit:hover .art .pk:nth-child(1){transform:translateX(-88%) rotate(-20deg)}
.kit:hover .art .pk:nth-child(2){transform:translateY(-18px) scale(1.06)}
.kit:hover .art .pk:nth-child(3){transform:translateX(88%) rotate(20deg)}
.kit .art h4{position:absolute;top:16px;left:18px;font-size:1.15rem;font-weight:800;color:#13201A}

.marq .mt{display:flex;gap:56px;width:max-content;animation:marq 32s linear infinite}
.marq:hover .mt{animation-play-state:paused}
.marq span{font-family:var(--display);font-weight:800;font-size:1.6rem;color:var(--muted);opacity:.55;white-space:nowrap;transition:opacity .2s,color .2s;cursor:default}
.marq span:hover{opacity:1;color:var(--green-ink)}

const SYN={cabeca:'dor',febre:'dor',dor:'dor',muscular:'dor',colica:'estomago',verme:'estomago',barriga:'estomago',gripe:'gripe',resfriado:'gripe',nariz:'gripe',pressao:'continuo',hipertensao:'continuo',curativo:'socorros',machucado:'socorros',bebe:'bebe',fralda:'bebe',pele:'dermo',sol:'dermo',protetor:'dermo',dente:'higiene',vitamina:'suplementos'};
function doSearch(q){
 const n=norm(q.trim()); if(!n)return null;
 const toks=n.split(/\s+/);
 const cats=new Set(); toks.forEach(t=>Object.keys(SYN).forEach(k=>{if(k.startsWith(t)&&t.length>2)cats.add(SYN[k])}));
 const fuzzy=(h,t)=>h.includes(t)||(t.length>4&&lev(h,t));
 const res=P.filter(p=>p.raw!=='').map(p=>{const hay=norm([p.n,p.m,p.pa,p.ean,p.q].join(' '));let s=0;toks.forEach(t=>{if(hay.includes(t))s+=3;else if(fuzzy(hay,t))s+=1});if(cats.has(p.c))s+=2;return{p,s}}).filter(x=>x.s>0).sort((a,b)=>b.s-a.s||a.p.p-b.p.p).map(x=>x.p);
 return{res,cats:[...cats]};
}
function lev(hay,t){return hay.split(/\s+/).some(w=>{if(Math.abs(w.length-t.length)>2)return false;let d=0,i=0,j=0;while(i<w.length&&j<t.length){if(w[i]===t[j]){i++;j++}else{d++;if(w.length>t.length)i++;else if(t.length>w.length)j++;else{i++;j++}}}d+=(w.length-i)+(t.length-j);return d<=2})}
function hl(s,q){let o=esc(s);norm(q).split(/\s+/).filter(t=>t.length>1).forEach(t=>{const i=norm(s).indexOf(t);if(i>=0){const seg=s.slice(i,i+t.length);o=o.replace(esc(seg),'<mark>'+esc(seg)+'</mark>')}});return o}

function addToBag(id,q=1,fromEl){
 const it=S.bag.find(b=>b.id===id); if(it)it.q+=q; else S.bag.push({id,q});
 const cnt=$('#bagCnt'), btn=$('#bagBtn');
 if(fromEl&&btn&&!matchMedia('(prefers-reduced-motion: reduce)').matches){
  const a=fromEl.getBoundingClientRect(), b=btn.getBoundingClientRect();
  const f=fromEl.cloneNode(true); f.className='flyer'; Object.assign(f.style,{left:a.left+'px',top:a.top+'px',width:a.width+'px'});
  document.body.appendChild(f);
  f.animate([{transform:'translate(0,0) scale(1) rotate(0)',opacity:1},{transform:`translate(${(b.left-a.left)*.5}px,${b.top-a.top-120}px) scale(.6) rotate(-20deg)`,opacity:1,offset:.55},{transform:`translate(${b.left-a.left-a.width/2+22}px,${b.top-a.top-a.height/2+22}px) scale(.12) rotate(-40deg)`,opacity:.6}],{duration:750,easing:'cubic-bezier(.5,0,.3,1)'}).onfinish=()=>{f.remove();upd()};

async function processImg(im,name){
 const ci=$('#cvIn'),co=$('#cvOut');if(!ci)return;
 const preset=S.preset||'1200', OW=preset==='mob'?500:preset==='800'?800:1200, OH=preset==='mob'?1000:OW;
 ci.width=im.naturalWidth;ci.height=im.naturalHeight;ci.getContext('2d').drawImage(im,0,0);
 $('#inInfo').textContent=im.naturalWidth+' × '+im.naturalHeight+' px';
 $$('.stp').forEach(s=>s.classList.remove('ok'));
 // fundo: média dos cantos; máscara por distância de cor
 const w=Math.min(im.naturalWidth,900), h=Math.round(im.naturalHeight*w/im.naturalWidth);
 const t=document.createElement('canvas');t.width=w;t.height=h;const tx=t.getContext('2d',{willReadFrequently:true});tx.drawImage(im,0,0,w,h);
 const d=tx.getImageData(0,0,w,h), px=d.data;
 const corner=(x,y)=>{const i=(y*w+x)*4;return[px[i],px[i+1],px[i+2]]};
 const cs=[corner(2,2),corner(w-3,2),corner(2,h-3),corner(w-3,h-3)];
 const bg=[0,1,2].map(k=>cs.reduce((a,c)=>a+c[k],0)/4);
 let minX=w,minY=h,maxX=0,maxY=0;
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4;const dd=Math.hypot(px[i]-bg[0],px[i+1]-bg[1],px[i+2]-bg[2]);
  // gradiente de fundo: tolerância maior
  if(dd<38){px[i+3]=0}else if(dd<58){px[i+3]=Math.round((dd-38)/20*255)}else{if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y}}
 tx.putImageData(d,0,0);
 await step(0);
 if(maxX<=minX){minX=0;minY=0;maxX=w-1;maxY=h-1}
 await step(1);
 co.width=OW;co.height=OH;const ox=co.getContext('2d');
 ox.fillStyle='#FFFFFF';ox.fillRect(0,0,OW,OH);
 const bw=maxX-minX+1,bh=maxY-minY+1,m=0.08,sc=Math.min(OW*(1-2*m)/bw,OH*(1-2*m)/bh);
 const dw=bw*sc,dh=bh*sc,dx=(OW-dw)/2,dy=(OH-dh)/2;
 await step(2);
 ox.save();ox.filter='blur('+Math.round(OW/60)+'px)';ox.fillStyle='rgba(19,32,26,.22)';ox.beginPath();ox.ellipse(OW/2,dy+dh+OW*0.015,dw*0.42,OW*0.02,0,0,Math.PI*2);ox.fill();ox.restore();
 ox.drawImage(t,minX,minY,bw,bh,dx,dy,dw,dh);
 await step(3);
 let ean=null;
 try{if('BarcodeDetector' in window){const bd=new BarcodeDetector({formats:['ean_13','ean_8','upc_a']});const r=await bd.detect(ci);if(r[0])ean=r[0].rawValue}}catch(e){}
 if(!ean&&/exemplo/.test(name))ean='7891058003142';
 await step(4);
 $('#fname').textContent=(ean||'sem-ean-'+Date.now().toString().slice(-5))+'.jpg';
 $('#outInfo').textContent=OW+' × '+OH+' px · fundo branco';
 await step(5);
}
function step(i){return new Promise(r=>setTimeout(()=>{const s=$(`[data-stp="${i}"]`);if(s)s.classList.add('ok');r()},220))}

 $('#layer').innerHTML=`<div class="scrim c" data-close></div><div class="cmd" role="dialog" aria-label="Busca rápida"><input id="cmdq" placeholder="Buscar páginas, produtos, ações…" autocomplete="off"><div class="list" id="cmdl"></div></div>`;
 const q=$('#cmdq'),l=$('#cmdl');
 const draw=()=>{const n=norm(q.value);const f=items.filter(x=>norm(x.t).includes(n)).slice(0,9);act=Math.min(act,f.length-1);l.innerHTML=f.map((x,i)=>`<button class="it ${i===act?'act':''}" data-ci="${i}">${x.p?pk(x.p):ic(x.i)}<span>${esc(x.t)}</span><small>${esc(x.s)}</small></button>`).join('')||'<div class="empty">Nada encontrado</div>';$$('[data-ci]',l).forEach(b=>b.onclick=()=>{$('#layer').innerHTML='';f[+b.dataset.ci].go()});return f};
 let cur=draw();q.focus();
 q.oninput=()=>{act=0;cur=draw()};
 q.onkeydown=e=>{if(e.key==='ArrowDown'){act=(act+1)%cur.length;cur=draw();e.preventDefault()}if(e.key==='ArrowUp'){act=(act-1+cur.length)%cur.length;cur=draw();e.preventDefault()}if(e.key==='Enter'&&cur[act]){$('#layer').innerHTML='';cur[act].go()}};
}

/* assistentes do painel */
function newProduct(){
 let st=0;const np={id:25,n:'Paracetamol 750 mg',q:'20 comprimidos',m:'EMS',c:'dor',pa:'paracetamol',p:9.9,t:'gen',k:'box',col:'#FFFFFF',ac:'#0057A8',raw:'PARACETAMOL 750MG 20CPR',ean:'7896004700014',img:true,sc:94,ind:'Analgésico e antitérmico, indicado para dor e febre.'};
 const draw=()=>{
  let b='';
  if(st===0)b=`<span class="muted" style="font-size:.8rem">Passo 1 de 3</span><h2>Qual é o código de barras?</h2><p class="muted">Digite ou aponte a câmera para a caixa. O resto a gente preenche sozinho.</p><div class="big-in"><input id="eanIn" inputmode="numeric" value="7896004700014" aria-label="Código de barras"><button class="btn line" style="height:56px" data-act="scan">${ic('scan')}</button></div><div id="look"></div>`;
  if(st===1)b=`<span class="muted" style="font-size:.8rem">Passo 2 de 3</span><h2>Confira os dados</h2><div class="found"><div class="bx">${pk(np)}</div><div class="ff"><label>Nome na loja <span><input value="${np.n}, ${np.q}"></span></label><label>Categoria<select><option>Dor e febre</option><option>Gripe e resfriado</option></select></label></div></div><div class="ff" style="grid-template-columns:1fr 1fr;display:grid"><label>Fabricante <input value="EMS"></label><label>Preço (vem do sistema) <input value="R$ 9,90"></label></div><p class="muted" style="font-size:.8rem">${ic('spark')} Nome, categoria, foto e descrição preenchidos a partir da bula e do cadastro do fabricante.</p>`;
  if(st===2)b=`<span class="muted" style="font-size:.8rem">Passo 3 de 3</span><h2>Assim fica na loja</h2><div class="offprev">${cardHTML(np)}<div style="display:grid;gap:8px;font-size:.88rem"><span>${ic('check')} Foto tratada no padrão</span><span>${ic('check')} Descrição revisável</span><span>${ic('check')} Estoque nas 7 lojas</span><span class="muted">Pode publicar agora ou agendar.</span></div></div>`;
  $('#layer').innerHTML=`<div class="scrim" data-close></div><div class="wiz" role="dialog" aria-label="Novo produto"><div class="wsteps">${[0,1,2].map(i=>`<i class="${i<=st?'on':''}"></i>`).join('')}</div>${b}<div class="wact"><button class="btn line" data-close>Cancelar</button><button class="btn g" id="wnext">${st===0?'Buscar produto':st===1?'Continuar':'Publicar na loja'}</button></div></div>`;
  $('#wnext').onclick=()=>{
   if(st===0){const l=$('#look');l.innerHTML='<div class="sk"></div><div class="sk" style="height:40px"></div>';setTimeout(()=>{st=1;draw()},900);return}
   if(st===1){st=2;draw();return}
   if(!byId(25))P.push(np);$('#layer').innerHTML='';toast('Paracetamol 750 mg publicado na loja');if(S.adm==='catalogo')renderAdmin();
  };
  const e=$('#eanIn');if(e)e.focus();
 };draw();
}
function newOffer(){
 let pid=6,pct=15;
 const draw=()=>{
  const base=byId(pid),orig=base.o||base.p,prev=Object.assign({},base,{o:orig,p:Math.round(orig*(1-pct/100)*100)/100});
  $('#layer').innerHTML=`<div class="scrim" data-close></div><div class="wiz" role="dialog" aria-label="Criar oferta"><h2>Criar oferta</h2>
  <div class="ff"><label>Produto<select id="ofp">${P.filter(p=>p.raw).map(p=>`<option value="${p.id}" ${p.id===pid?'selected':''}>${esc(p.n)} · ${esc(p.q)}</option>`).join('')}</select></label>
  <label>Desconto: <b style="color:var(--red);font-size:1.1rem" id="ofpct">${pct}%</b><input type="range" class="range" id="ofr" min="5" max="50" step="1" value="${pct}"></label>
  <label>Vale até<select><option>Domingo, 30/11</option><option>Sexta, 05/12</option><option>Enquanto durar o estoque</option></select></label></div>
  <div class="offprev" id="ofprev">${cardHTML(prev)}<div style="display:grid;gap:6px;font-size:.88rem"><b>Prévia ao vivo</b><span class="muted">De ${brl(orig)} por <b style="color:var(--ink)">${brl(prev.p)}</b>.</span><span class="muted">Entra sozinha em "Ofertas da semana" e sai na data final.</span></div></div>
  <div class="wact"><button class="btn line" data-close>Cancelar</button><button class="btn g" id="ofok">Publicar oferta</button></div></div>`;
  $('#ofp').onchange=e=>{pid=+e.target.value;draw()};
  $('#ofr').oninput=e=>{pct=+e.target.value;$('#ofpct').textContent=pct+'%';const pv=Object.assign({},base,{o:orig,p:Math.round(orig*(1-pct/100)*100)/100});$('#ofprev').firstElementChild.outerHTML=cardHTML(pv);$('#ofprev').lastElementChild.querySelector('span').innerHTML='De '+brl(orig)+' por <b style="color:var(--ink)">'+brl(pv.p)+'</b>.'};
  $('#ofok').onclick=()=>{base.o=orig;base.p=Math.round(orig*(1-pct/100)*100)/100;$('#layer').innerHTML='';toast('Oferta publicada: '+base.n+' -'+pct+'%')};
 };draw();
}

/* ================= modo e eventos ================= */
function setMode(m){
 S.mode=m;
 $('#seg').classList.toggle('admin',m==='admin');
 $('#bStore').setAttribute('aria-pressed',m==='store');$('#bAdmin').setAttribute('aria-pressed',m==='admin');
 vt(()=>{$('#store').hidden=m!=='store';$('#admin').hidden=m!=='admin';$('#layer').innerHTML='';if(m==='admin')renderAdmin();else renderStore();scrollTo({top:0})});
}
$('#bStore').onclick=()=>setMode('store');
$('#bAdmin').onclick=()=>setMode('admin');

document.addEventListener('click',e=>{
 const rb=e.target.closest('[data-rail]');if(rb){const rl=$('#'+rb.dataset.rail);rl.scrollBy({left:+rb.dataset.dir*rl.clientWidth*.85,behavior:'smooth'});return}
 const hb=e.target.closest('[data-hs]');if(hb){const v=hb.dataset.hs;goHero(v==='prev'?hIdx-1:v==='next'?hIdx+1:+v);return}
 if(e.target.closest('.railw .rail.drag')){e.preventDefault();return}
 const t=e.target.closest('[data-open],[data-add],[data-fav],[data-cat],[data-go],[data-act],[data-close],[data-filter],[data-bq],[data-setstore],[data-sq],[data-adm],[data-adv],[data-cf],[data-bulk],[data-rv],[data-preset]');
 if(!t)return;
 const d=t.dataset;
 if(d.add){e.stopPropagation();addToBag(+d.add,1,t.closest('.card')?.querySelector('.img .pk')||t.closest('.mmini')?.querySelector('.pk'));return}
 if(d.fav){e.stopPropagation();const id=+d.fav;S.fav.has(id)?S.fav.delete(id):S.fav.add(id);t.classList.toggle('on');t.animate([{transform:'scale(1)'},{transform:'scale(1.35)'},{transform:'scale(1)'}],{duration:350});return}
 if(d.open){openProduct(+d.open);$('#sdrop')&&($('#sdrop').innerHTML='');return}
 if(d.sq){const q=$('#q');q.value=d.sq;q.dispatchEvent(new Event('input'));q.focus();return}
 if(d.cat){S.view='cat';S.cat=d.cat;S.sub=d.sub||null;S.filter=d.fl||'todos';if(S.mega)setMega(null);$('#layer').innerHTML='';if(S.mode!=='store')setMode('store');else vt(renderStore);scrollTo({top:0,behavior:'smooth'});return}
 if(d.go){if(S.mode!=='store'){setMode('store');return}S.view=d.go==='stores'?'stores':'home';vt(renderStore);scrollTo({top:0,behavior:'smooth'});return}
 if(d.filter){S.filter=d.filter;vt(renderStore);return}
 if(d.close!==undefined){closeLayer();return}
 if(d.bq){const it=S.bag.find(b=>b.id===+d.bq);it.q+= +d.d;if(it.q<1)S.bag=S.bag.filter(b=>b!==it);renderStoreHead();openBag();return}
 if(d.setstore){S.store=STORES[+d.setstore];vt(renderStore);toast('Loja escolhida: '+S.store.n);return}
 if(d.adm){S.adm=d.adm;S.sel.clear();vt(renderAdmin);scrollTo({top:0});return}
 if(d.adv){const o=S.orders.find(x=>x.id===+d.adv);o.st++;vt(renderAdmin);toast('Pedido #'+o.id+' em '+COLS[o.st][0].toLowerCase());return}
 if(d.cf){S.catFilter=d.cf;renderAdmin();return}
 if(d.bulk){if(d.bulk==='clear'){S.sel.clear();renderAdmin();return}const n=S.sel.size;S.sel.clear();renderAdmin();toast(d.bulk==='ia'?n+' produtos enviados para a fila da IA':d.bulk==='cat'?'Categoria aplicada em '+n+' produtos':'Fabricante unificado em '+n+' produtos');return}
 if(d.rv){review(d.rv);return}
 if(d.preset){e.preventDefault();S.preset=d.preset;$$('[data-preset]').forEach(b=>b.classList.toggle('on',b===t));if(S.lastImg)processImg(S.lastImg,S.lastName);else sampleImg();return}
 const a=d.act;
 if(a==='bag')openBag();
 if(a==='checkout')checkout();
 if(a==='copypix'){navigator.clipboard?.writeText('pix-exemplo-prototipo').then(()=>toast('Código Pix copiado'),()=>toast('Selecione o código e copie'))}
 if(a==='pickstore'){S.view='stores';vt(renderStore)}
 if(a==='scan')toast('Abriria a câmera para ler o código de barras');
 if(a==='rx')toast('Abriria o envio da foto da receita');
 if(a==='cmd')openCmd();
 if(a==='sendimg')toast('Imagem vinculada ao produto e publicada');
 if(a==='sync')toast('Sincronização iniciada');
 if(a==='top')scrollTo({top:0,behavior:'smooth'});
 if(a==='track')toast('Abriria o acompanhamento dos seus pedidos');
 if(a==='cont')toast('Abriria a lista dos seus remédios de uso contínuo');
 if(a==='pts')toast('Você tem 1.240 SL Pontos (exemplo)');
 if(a==='lab')toast('Abriria os programas de desconto dos laboratórios');
 if(a==='vac')toast('Abriria agendamento de vacinas e testes');
 if(a==='near'){S.view='stores';vt(renderStore)}
 if(a==='news')toast('Cadastro de e-mail simulado');
 if(a==='newprod')newProduct();
 if(a==='offer')newOffer();
 if(a==='photo'){S.adm='imagens';vt(renderAdmin)}
 if(a==='orders'){S.adm='pedidos';vt(renderAdmin)}
 if(a==='seestore'){S.view='home';setMode('store')}
});
document.addEventListener('keydown',e=>{
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){if(S.mode==='admin'){e.preventDefault();openCmd()}else{e.preventDefault();$('#q')?.focus()}}
 if(e.key==='Escape'&&$('#layer').innerHTML){closeLayer()}
 const tag=(e.target.tagName||'').toLowerCase();
 if(S.mode==='admin'&&S.adm==='revisao'&&!['input','textarea'].includes(tag)&&!e.target.isContentEditable&&!$('#layer').innerHTML){const k=e.key.toLowerCase();if(k==='a')review('ok');if(k==='r')review('no');if(k==='e')review('edit')}
});

seedOrders();
renderStore();
</script>
